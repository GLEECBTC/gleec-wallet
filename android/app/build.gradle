plugins {
    id "com.android.application"
    // START: FlutterFire Configuration
    //! The Firebase services is applied conditionally based on the presence of a valid google-services.json file in the next step.
    // id 'com.google.gms.google-services' 
    // END: FlutterFire Configuration
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

// Check if google-services.json contains placeholder text
def googleServicesFile = file("google-services.json")
def shouldUseGoogleServices = false

if (googleServicesFile.exists()) {
    def fileContent = googleServicesFile.text
    if (!fileContent.contains("<THIS_IS_AUTOGENERATED>")) {
        shouldUseGoogleServices = true
    } else {
        println("Skipping Google Services - placeholder file detected")
    }
}

// Only apply plugin if it's a real config file
if (shouldUseGoogleServices) {
    apply plugin: 'com.google.gms.google-services'
}


def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

def supportedReleaseAbis = ['armeabi-v7a', 'arm64-v8a']

// Packaging checks deliberately bypass signing credentials. Distribution
// builds may provide the existing CI key.properties contract, but never fall
// back to the Android debug key when those credentials are absent.
def unsignedRelease = providers.gradleProperty('gleecUnsignedRelease').orNull == 'true'
// Explicit internal builds use a separate app sandbox and the development signer.
def internalTesting = providers.gradleProperty('gleecInternalTesting').orNull == 'true'
def releaseSigningProperties = new Properties()
def releaseSigningPropertiesFile = rootProject.file('key.properties')
def hasReleaseSigning = !unsignedRelease && releaseSigningPropertiesFile.exists()
if (hasReleaseSigning) {
    releaseSigningPropertiesFile.withInputStream { releaseSigningProperties.load(it) }
    if (['storeFile', 'storePassword', 'keyAlias', 'keyPassword'].any {
        !releaseSigningProperties.getProperty(it)?.trim()
    } || !file(releaseSigningProperties.getProperty('storeFile')).isFile()) {
        throw new GradleException('Release signing configuration is incomplete. Provide a valid android/key.properties or use -PgleecUnsignedRelease=true for an unsigned packaging check.')
    }
}

android {
    namespace 'com.gleec.gleecdex'

    compileSdk 36
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId internalTesting ? "com.gleec.gleecdex.onboardinginternal" : "com.gleec.gleecdex"
        manifestPlaceholders.walletAppLabel = internalTesting ? "Gleec Wallet Internal" : "Gleec Dex"
        minSdkVersion 28
        targetSdkVersion 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    ndkVersion = "28.2.13676358"

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseSigningProperties.getProperty('storeFile'))
                storePassword releaseSigningProperties.getProperty('storePassword')
                keyAlias releaseSigningProperties.getProperty('keyAlias')
                keyPassword releaseSigningProperties.getProperty('keyPassword')
            }
        }
    }

    buildTypes {
        all { buildType ->
            if (!buildType.debuggable) {
                // Override Flutter's default ABI list for non-debuggable builds.
                buildType.ndk.abiFilters.clear()
                buildType.ndk.abiFilters.addAll(supportedReleaseAbis)
            }
        }
        release {
            signingConfig internalTesting ? signingConfigs.debug : (hasReleaseSigning ? signingConfigs.release : null)
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    // Also used by local_auth; explicitly declared for the credential vault's
    // CryptoObject integration (no Boolean-only authentication shortcut).
    implementation "androidx.biometric:biometric:1.1.0"
}
