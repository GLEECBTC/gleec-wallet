<style>
@font-face { font-family: Manrope; src: url('gleec-unified-swap-assets/fonts/Manrope-Regular.ttf') format('truetype'); font-weight: 400; font-display: swap; }
@font-face { font-family: Manrope; src: url('gleec-unified-swap-assets/fonts/Manrope-Medium.ttf') format('truetype'); font-weight: 500; font-display: swap; }
@font-face { font-family: Manrope; src: url('gleec-unified-swap-assets/fonts/Manrope-SemiBold.ttf') format('truetype'); font-weight: 600; font-display: swap; }
@font-face { font-family: Manrope; src: url('gleec-unified-swap-assets/fonts/Manrope-Bold.ttf') format('truetype'); font-weight: 700; font-display: swap; }

#gleec-unified-swap-spec {
  --brand: #8c41ff;
  --brand-hover: #a162ff;
  --brand-pressed: #7530e3;
  --success: #62dd98;
  --warning: #f3c95f;
  --pending: #ff9b5a;
  --danger: #ff7aaa;
  --info: #82b1ff;
  --canvas: #0a0c15;
  --surface: #0f1221;
  --surface-raised: #171a2c;
  --surface-high: #202337;
  --surface-highest: #24273d;
  --selected: #2e145c;
  --text: #ffffff;
  --text-secondary: #d7dae7;
  --text-tertiary: #aeb5cf;
  --border: #30344d;
  --border-strong: #4e5575;
  --control-border: #747a9b;
  --success-bg: #0b3b26;
  --warning-bg: #3a2d06;
  --pending-bg: #3b210f;
  --danger-bg: #441526;
  --info-bg: #102a4f;
  --shadow: 0 18px 48px rgba(0,0,0,.32);
  --preview-scale: 1;
  color: var(--text);
  font-family: Manrope, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 16px;
  line-height: 1.5;
  width: 100%;
  color-scheme: dark;
}

#gleec-unified-swap-spec[data-theme="light"] {
  --brand-hover: #6f22dc;
  --brand-pressed: #6821d3;
  --success: #006b32;
  --warning: #745000;
  --pending: #9c3d00;
  --danger: #a80e45;
  --info: #1d559e;
  --canvas: #fafafd;
  --surface: #ffffff;
  --surface-raised: #ffffff;
  --surface-high: #f5f5fa;
  --surface-highest: #ebedf5;
  --selected: #f6eeff;
  --text: #0a0c15;
  --text-secondary: #4e5575;
  --text-tertiary: #555f80;
  --border: #d7dae7;
  --border-strong: #b0b6ce;
  --control-border: #767c96;
  --success-bg: #dff8ea;
  --warning-bg: #fff5d6;
  --pending-bg: #fff0e4;
  --danger-bg: #ffe7f0;
  --info-bg: #e6f0ff;
  --shadow: 0 18px 48px rgba(26,30,50,.12);
  color-scheme: light;
}

#gleec-unified-swap-spec * { box-sizing: border-box; }
.gus-workbench :where(button, input, select) { font-family: inherit; font-size: inherit; line-height: inherit; }
:where(#gleec-unified-swap-spec) button { color: inherit; }
#gleec-unified-swap-spec button:focus-visible,
#gleec-unified-swap-spec input:focus-visible,
#gleec-unified-swap-spec select:focus-visible,
#gleec-unified-swap-spec a:focus-visible {
  outline: 3px solid var(--brand);
  outline-offset: 3px;
}
.wallet-sheet h2[tabindex="-1"]:focus-visible,
.wallet-content h1[tabindex="-1"]:focus-visible {
  outline: 3px solid var(--brand);
  outline-offset: 4px;
  border-radius: 6px;
}
#gleec-unified-swap-spec button:disabled { cursor: not-allowed; opacity: .5; }
#gleec-unified-swap-spec [hidden] { display: none !important; }
.sr-only {
  position: absolute !important;
  width: 1px !important;
  height: 1px !important;
  padding: 0 !important;
  margin: -1px !important;
  overflow: hidden !important;
  clip: rect(0, 0, 0, 0) !important;
  white-space: nowrap !important;
  border: 0 !important;
}

.gus-workbench {
  background: var(--canvas);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 24px;
  overflow: clip;
  min-width: 0;
}
.gus-topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  padding: 20px 24px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
}
.gus-brand { display: flex; align-items: center; gap: 14px; min-width: 0; }
.gus-brand svg { display: block; flex: none; }
.gus-brand-copy { min-width: 0; }
.gus-brand-copy strong { display: block; font-size: 1.05rem; line-height: 1.2; }
.gus-brand-copy span { display: block; color: var(--text-tertiary); font-size: .78rem; margin-top: 3px; }
.gus-toolbar { display: flex; align-items: center; justify-content: flex-end; flex-wrap: wrap; gap: 8px; }
.gus-control {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  min-height: 48px;
  padding: 0 14px;
  border: 1px solid var(--border);
  border-radius: 14px;
  background: var(--surface-high);
  color: var(--text-secondary);
}
.gus-control select {
  border: 0;
  background: transparent;
  color: inherit;
  min-height: 48px;
  cursor: pointer;
}
.gus-icon-button,
.gus-tab,
.gus-state-button,
.gus-btn,
.wallet-nav-item,
.wallet-asset-select,
.wallet-link,
.wallet-switch,
.wallet-option,
.wallet-picker-row,
.wallet-filter,
.flow-card {
  cursor: pointer;
  touch-action: manipulation;
}
.gus-icon-button {
  width: 48px;
  height: 48px;
  display: inline-grid;
  place-items: center;
  border: 1px solid var(--border);
  border-radius: 14px;
  background: var(--surface-high);
}
.gus-tabs {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  padding: 14px 20px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
}
.gus-tab {
  min-height: 48px;
  padding: 10px 14px;
  border: 1px solid transparent;
  border-radius: 14px;
  background: transparent;
  color: var(--text-secondary);
  text-align: left;
}
.gus-tab:hover { background: var(--surface-high); }
.gus-tab[aria-selected="true"] {
  color: var(--text);
  background: var(--selected);
  border-color: var(--brand);
}
.gus-tab b { display: block; font-size: .72rem; color: var(--text-tertiary); margin-bottom: 2px; }
.gus-main { padding: 24px; min-width: 0; }
.gus-section-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; margin-bottom: 22px; }
.gus-section-head h2 { margin: 0; font-size: clamp(1.45rem, 2.8vw, 2rem); line-height: 1.2; }
.gus-section-head p { max-width: 720px; margin: 8px 0 0; color: var(--text-secondary); }
.gus-kicker { color: var(--brand-hover); font-size: .78rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
.gus-layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(230px, 310px); gap: 22px; align-items: start; }
.gus-preview-panel { min-width: 0; }
.gus-inspector {
  display: grid;
  gap: 16px;
  position: sticky;
  top: 12px;
  min-width: 0;
}
.gus-card {
  background: var(--surface-raised);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 18px;
}
.gus-card h3 { margin: 0 0 12px; font-size: 1rem; }
.gus-card p { color: var(--text-secondary); margin: 6px 0 0; }
.gus-state-list { display: flex; flex-wrap: wrap; gap: 8px; }
.gus-state-button {
  min-height: 48px;
  padding: 8px 11px;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: var(--surface-high);
  color: var(--text-secondary);
  font-size: .8rem;
  text-align: left;
}
.gus-state-button[aria-pressed="true"] { border-color: var(--brand); background: var(--selected); color: var(--text); }
.gus-note { border-left: 3px solid var(--brand); padding-left: 12px; color: var(--text-secondary); font-size: .84rem; }
.gus-badge,
.wallet-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 28px;
  padding: 4px 9px;
  border-radius: 999px;
  background: var(--surface-high);
  border: 1px solid var(--border);
  color: var(--text-secondary);
  font-size: 13px;
  font-weight: 700;
}
.gus-badge.brand, .wallet-badge.brand { background: var(--selected); border-color: var(--brand); color: var(--text); }
.gus-badge.success, .wallet-badge.success { background: var(--success-bg); border-color: var(--success); color: var(--success); }
.gus-badge.warning, .wallet-badge.warning { background: var(--warning-bg); border-color: var(--warning); color: var(--warning); }
.gus-badge.danger, .wallet-badge.danger { background: var(--danger-bg); border-color: var(--danger); color: var(--danger); }
.gus-badge.info, .wallet-badge.info { background: var(--info-bg); border-color: var(--info); color: var(--info); }
.gus-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 16px; }
.gus-grid.compact { grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); }
.gus-divider { height: 1px; background: var(--border); margin: 18px 0; }
.gus-rule-list { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; }
.gus-rule-list li { display: grid; grid-template-columns: 24px 1fr; gap: 10px; color: var(--text-secondary); }
.gus-rule-list i { color: var(--brand-hover); }
.gus-callout { display: flex; gap: 12px; align-items: flex-start; padding: 14px; border-radius: 14px; background: var(--info-bg); color: var(--text-secondary); border: 1px solid var(--info); }
.gus-callout.warning { background: var(--warning-bg); border-color: var(--warning); }
.gus-callout.danger { background: var(--danger-bg); border-color: var(--danger); }
.gus-callout i { color: var(--info); font-size: 1.1rem; margin-top: 2px; }
.gus-callout.warning i { color: var(--warning); }
.gus-callout.danger i { color: var(--danger); }
.gus-btn {
  min-height: 48px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 10px 16px;
  border: 1px solid var(--border);
  border-radius: 14px;
  background: var(--surface-high);
  color: var(--text);
  font-weight: 700;
}
.gus-btn:hover { background: var(--surface-highest); }
.gus-btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
.gus-btn.primary:hover { background: var(--brand-pressed); }
.gus-btn.danger { color: var(--danger); border-color: var(--danger); background: var(--danger-bg); }
.gus-btn.block { width: 100%; }

.preview-canvas {
  min-width: 0;
  padding: 22px;
  border: 1px solid var(--border);
  border-radius: 22px;
  background:
    linear-gradient(var(--border) 1px, transparent 1px),
    linear-gradient(90deg, var(--border) 1px, transparent 1px),
    var(--surface-high);
  background-size: 24px 24px;
  overflow: hidden;
}
.preview-caption { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin: 0 0 12px; color: var(--text-tertiary); font-size: .78rem; }
.wallet-stage { width: 100%; min-width: 0; overflow: hidden; }
.wallet-scale-shell { transform-origin: top left; }
.wallet-frame {
  --wallet-font: calc(16px * var(--preview-scale));
  width: var(--frame-width, 390px);
  margin-inline: auto;
  background: var(--canvas);
  border: 1px solid var(--border-strong);
  border-radius: 24px;
  box-shadow: var(--shadow);
  overflow: hidden;
  font-size: var(--wallet-font);
  color: var(--text);
  transition: background .22s ease;
  position: relative;
  display: grid;
  grid-template-rows: auto minmax(0,1fr) auto;
}
.wallet-frame[data-vp="375"] { height: 812px; }
.wallet-frame[data-vp="390"] { height: 844px; }
.wallet-frame[data-vp="768"] { height: 1024px; }
.wallet-frame * { box-sizing: border-box; }
.wallet-header {
  min-height: 64px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: calc(12px + env(safe-area-inset-top)) 18px 12px;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
}
.wallet-logo { display: flex; align-items: center; gap: 9px; color: var(--text); min-width: 0; }
.wallet-logo img { display: block; height: 32px; width: auto; max-width: 112px; }
.wallet-logo .wallet-logo-icon { width: 24px; height: 32px; flex: none; }
.wallet-wordmark { display: block; min-width: 0; }
.wallet-logo .logo-light { display: none; }
#gleec-unified-swap-spec[data-theme="light"] .wallet-logo .logo-dark { display: none; }
#gleec-unified-swap-spec[data-theme="light"] .wallet-logo .logo-light { display: block; }
.wallet-desktop-nav { display: none; align-items: center; gap: 4px; }
.wallet-nav-item {
  min-height: 48px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 10px 14px;
  border: 0;
  border-radius: 12px;
  background: transparent;
  color: var(--text-secondary);
  font-weight: 700;
}
.wallet-nav-item.active { background: var(--selected); color: var(--text); }
.wallet-frame[data-vp="1024"] .wallet-desktop-nav,
.wallet-frame[data-vp="1440"] .wallet-desktop-nav { display: flex; }
.wallet-main { padding: 24px 16px 32px; min-width: 0; overflow-y: auto; overscroll-behavior: contain; }
.wallet-frame[data-vp="768"] .wallet-main { padding-inline: 36px; }
.wallet-frame[data-vp="1024"] .wallet-main,
.wallet-frame[data-vp="1440"] .wallet-main { padding: 40px 40px 56px; }
.wallet-content { width: min(100%, 576px); margin-inline: auto; min-width: 0; }
.wallet-frame h1 { margin: 0 0 20px; font-size: 2em; line-height: 1.2; letter-spacing: -.02em; }
.wallet-frame h2 { margin: 0; font-size: 1.35em; line-height: 1.25; }
.wallet-frame h3 { margin: 0; font-size: 1.05em; }
.wallet-frame p { margin: 0; }
.wallet-amount-card {
  background: var(--surface-raised);
  border: 1px solid var(--control-border);
  border-radius: 20px;
  padding: 18px;
  min-width: 0;
}
.wallet-amount-card.has-error { border-color: var(--danger); }
.wallet-amount-card.is-focused { border-color: var(--brand); box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 28%, transparent); }
.wallet-card-top { display: flex; justify-content: space-between; gap: 12px; align-items: center; color: var(--text-secondary); font-size: .84em; }
.wallet-card-body { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 14px; align-items: center; margin-top: 16px; }
.wallet-amount { min-width: 0; }
.wallet-amount strong,
.wallet-amount-input { display: block; width: 100%; min-width: 0; min-height: 48px; padding: 0; border: 0; outline: 0; background: transparent; color: var(--text); font-size: 2.15em; font-weight: 800; line-height: 1.12; letter-spacing: -.035em; overflow-wrap: normal; word-break: normal; }
.wallet-amount span { display: block; color: var(--text-tertiary); margin-top: 6px; font-size: .86em; }
.wallet-asset-select {
  min-height: 52px;
  max-width: 190px;
  display: inline-flex;
  align-items: center;
  gap: 9px;
  padding: 8px 11px;
  border: 1px solid var(--control-border);
  border-radius: 14px;
  background: var(--surface-high);
  text-align: left;
}
.wallet-token-icon {
  width: 34px;
  height: 34px;
  flex: none;
  display: grid;
  place-items: center;
  border-radius: 12px;
  color: var(--brand-hover);
  background: var(--selected);
  font-size: 1.15em;
  position: relative;
  overflow: visible;
}
.wallet-token-icon > .wallet-token-artwork { width: 100%; height: 100%; display: block; border-radius: 50%; object-fit: cover; }
.wallet-token-icon .wallet-token-fallback { width: 100%; height: 100%; display: grid; place-items: center; border-radius: 50%; background: var(--surface-highest); color: var(--text); font-size: .66em; font-weight: 800; }
.wallet-chain-badge { position: absolute; right: -5px; bottom: -5px; width: 17px; height: 17px; padding: 2px; border-radius: 50%; background: var(--surface); border: 1px solid var(--border-strong); object-fit: contain; }
.wallet-asset-copy { min-width: 0; }
.wallet-asset-copy b { display: block; line-height: 1.1; }
.wallet-asset-copy small { display: block; color: var(--text-tertiary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 3px; }
.wallet-address-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding-top: 16px;
  margin-top: 16px;
  border-top: 1px solid var(--border);
  color: var(--text-secondary);
  font-size: .82em;
}
.wallet-address-footer > span { min-width: 0; overflow-wrap: anywhere; }
.wallet-address-trigger { min-height: 48px; min-width: 0; padding: 8px 0; border: 0; background: transparent; color: inherit; text-align: left; overflow-wrap: anywhere; cursor: pointer; }
.wallet-link { min-width: 48px; min-height: 48px; display: inline-flex; align-items: center; justify-content: center; border: 0; padding: 10px 8px; background: transparent; color: var(--brand-hover); font-weight: 700; flex: none; }
.wallet-switch {
  width: 48px;
  height: 48px;
  display: grid;
  place-items: center;
  margin: -8px auto;
  position: relative;
  z-index: 2;
  border: 6px solid var(--canvas);
  border-radius: 50%;
  background: var(--surface-highest);
}
.wallet-stack { display: grid; gap: 0; }
.wallet-helper { display: flex; gap: 8px; align-items: flex-start; margin-top: 10px; color: var(--text-secondary); font-size: .8em; }
.wallet-helper.error { color: var(--danger); }
.wallet-helper.warning { color: var(--warning); }
.wallet-quote-strip {
  display: grid;
  grid-template-columns: repeat(3, minmax(0,1fr));
  gap: 10px;
  margin-top: 14px;
  padding: 14px;
  border: 1px solid var(--border);
  border-radius: 16px;
  background: var(--surface);
}
.wallet-quote-strip div { min-width: 0; }
.wallet-quote-strip > div:not(.wallet-quote-action) > span { display: block; color: var(--text-tertiary); font-size: .82em; }
.wallet-quote-strip b { display: block; margin-top: 4px; font-size: .9em; overflow-wrap: anywhere; }
.wallet-quote-action { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-top: 8px; border-top: 1px solid var(--border); }
.wallet-ranking-note { display: block; margin-top: 5px; color: var(--text-tertiary); font-size: 13px; }
.wallet-primary {
  min-height: 52px;
  width: 100%;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin-top: 14px;
  padding: 12px 18px;
  border: 1px solid var(--brand);
  border-radius: 16px;
  background: var(--brand);
  color: #fff;
  font-weight: 800;
}
.wallet-primary:hover { background: var(--brand-pressed); }
.wallet-primary.secondary { color: var(--text); background: var(--surface-high); border-color: var(--control-border); }
.wallet-primary.danger { color: var(--danger); background: var(--danger-bg); border-color: var(--danger); }
.wallet-bottom-nav {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 4px;
  padding: 8px 12px calc(8px + env(safe-area-inset-bottom));
  border-top: 1px solid var(--border);
  background: var(--surface);
  position: relative;
  z-index: 10;
}
.wallet-bottom-nav .wallet-nav-item { flex-direction: column; gap: 2px; font-size: .78em; padding: 6px; }
.wallet-frame[data-vp="1024"] .wallet-bottom-nav,
.wallet-frame[data-vp="1440"] .wallet-bottom-nav { display: none; }
.wallet-layout.has-sheet { display: grid; gap: 24px; align-items: start; }
.wallet-frame[data-vp="1024"] .wallet-layout.has-sheet,
.wallet-frame[data-vp="1440"] .wallet-layout.has-sheet { grid-template-columns: minmax(0,1fr) clamp(280px,42%,520px); }
.wallet-frame[data-vp="1024"] .wallet-layout.has-sheet .wallet-content,
.wallet-frame[data-vp="1440"] .wallet-layout.has-sheet .wallet-content { margin-right: 0; }
.wallet-frame[data-vp="375"] .wallet-layout.has-sheet,
.wallet-frame[data-vp="390"] .wallet-layout.has-sheet,
.wallet-frame[data-vp="768"] .wallet-layout.has-sheet { display: block; }
.wallet-frame[data-vp="375"] .wallet-layout.has-sheet > .wallet-content,
.wallet-frame[data-vp="390"] .wallet-layout.has-sheet > .wallet-content,
.wallet-frame[data-vp="768"] .wallet-layout.has-sheet > .wallet-content { display: none; }
.wallet-frame[data-vp="375"] .wallet-layout.has-sheet > .wallet-sheet,
.wallet-frame[data-vp="390"] .wallet-layout.has-sheet > .wallet-sheet {
  padding: 0;
  border: 0;
  border-radius: 0;
  box-shadow: none;
  background: var(--canvas);
}
.wallet-frame[data-vp="768"] .wallet-layout.has-sheet > .wallet-sheet { width: min(100%, 576px); margin-inline: auto; }
.wallet-sheet {
  background: var(--surface-raised);
  border: 1px solid var(--border);
  border-radius: 22px;
  box-shadow: var(--shadow);
  padding: 18px;
  min-width: 0;
}
.wallet-side-panel { min-width: 0; }

  function createQuoteEvaluationController({
    schedule,
    cancelScheduled,
    onTransition,
    completionDelay = 450,
    timeoutDelay = 4000
  }) {
    let revision = 0;
    let current = null;
    let completionHandle = null;
    let timeoutHandle = null;

    function clearScheduledWork() {
      if (completionHandle !== null) cancelScheduled(completionHandle);
      if (timeoutHandle !== null) cancelScheduled(timeoutHandle);
      completionHandle = null;
      timeoutHandle = null;
    }

    function emit(request, status) {
      if (!current || current.status !== 'checking' || request.revision !== current.revision || request.intentKey !== current.intentKey) return false;
      const terminal = status !== 'checking';
      if (terminal) clearScheduledWork();
      current = {...request,status};
      onTransition({...current});
      return true;
    }

    function begin({intentKey, outcome = 'quoted-multiple', target = 'entry', delay = completionDelay} = {}) {
      clearScheduledWork();
      const request = {revision:++revision,intentKey:String(intentKey || ''),outcome,target};
      current = {...request,status:'checking'};
      onTransition({...current});
      if (Number.isFinite(delay)) completionHandle = schedule(()=>emit(request,outcome),Math.max(0,delay));
      timeoutHandle = schedule(()=>emit(request,'quote-timeout'),Math.max(0,timeoutDelay));
      return request.revision;
    }

    function cancel() {
      clearScheduledWork();
      revision += 1;
      current = null;
      return revision;
    }

    function snapshot() {
      return current ? {...current} : null;
    }

    return Object.freeze({begin,cancel,snapshot});
  }

  function reviewPermissionCopy(config) {
    const permission = String(config.permission || '');
    if (/no token permission|no permission required|no permission requested|permission:\s*none/i.test(permission)) {
      return ['No token approval needed','You’ll only sign the swap request when you start.'];
    }
    if (/existing permission|sufficient/i.test(permission)) {
      return ['No new token approval needed','Your existing approval covers this swap; no broader permission will be requested.'];
    }
    if (/reset/i.test(permission)) {
      const exactAmount = permission.split(/exact approval:\s*/i)[1] || config.payAmount;
      return ['Reset, then exact approval',`Reset the current permission, then approve ${exactAmount} for this swap only — never unlimited.`];
    }
    const exactAmount = permission.replace(/^Exact approval:\s*/i,'') || config.payAmount;
    return ['Exact approval only',`Approve ${exactAmount} for this swap only — never unlimited.`];
  }

  function findActivityItem(id) {
    return Object.values(activityRows).flat().find(row=>row.id===id || row.executionId===id) || null;

  function persistExecutionToActivity() {
    if (!state.executionConsent) return null;
    const consent = {...state.executionConsent};
    const executionId = consent.executionId || `route_live_${String(consent.fixtureId || 'swap').replaceAll('-','_')}_${state.selectedOption || 'selected'}`;
    consent.executionId = executionId;
    state.executionConsent.executionId = executionId;
    const progressState = state.progress || consent.initialProgress || 'planned';
    const statusByProgress = {
      planned:'Preparing swap','awaiting-approval':'Approval required',resetting:'Resetting token permission',approving:'Approving exact amount',
      'awaiting-signature':'Signature required',signed:'Reconciling signed request',broadcasting:`Sending on ${consent.sourceNetwork}`,
      'source-pending':`Confirming on ${consent.sourceNetwork}`,'source-confirmed':`Confirmed on ${consent.sourceNetwork}`,
      'bridge-pending':`Moving to ${consent.destinationNetwork}`,'destination-confirmed':`Arrived on ${consent.destinationNetwork}`,
      converting:`Converting to ${consent.destinationAsset}`,'action-required':'Review updated swap','stop-requested':'Stop requested',
      reconciliation:'Confirming final result','wallet-rejection':'Signature declined',reverted:'Transaction reverted',
      cancelled:'Cancelled before funds moved',completed:'Received'
    };
    const attention = ['action-required','wallet-rejection','reverted'].includes(progressState);
    const terminal = ['completed','cancelled'].includes(progressState);
    const bucket = terminal ? 'completed' : attention ? 'attention' : 'active';
    Object.values(activityRows).forEach(rows=>{
      const index = rows.findIndex(row=>row.executionId===executionId || row.id===executionId);
      if (index >= 0) rows.splice(index,1);
    });
    const row = {
      id:executionId,executionId,journey:consent.fixtureId,timelineKind:consent.timelineKind,timelineState:progressState,consent,
      evidence:executionEvidence[progressState] || executionEvidence.planned,asset:consent.sourceAsset,network:consent.sourceNetwork,
      outcome:`${consent.payAmount} on ${consent.sourceNetwork} → ${consent.expected} on ${consent.destinationNetwork}`,
      status:statusByProgress[progressState] || 'In progress',updated:'Updated just now',needsAction:attention
    };
    if (progressState === 'completed') row.verifiedHolding = `${consent.expected} at ${consent.to} on ${consent.destinationNetwork}`;
    if (progressState === 'cancelled') row.verifiedHolding = `${consent.payAmount} remains at ${consent.from} on ${consent.sourceNetwork}`;
    activityRows[bucket].unshift(row);
    state.selectedExecutionId = executionId;
    return row;
  }

  function runFixtureAssertions() {
    const checks = [];
    const check = (name,condition) => checks.push({name,passed:Boolean(condition)});

    Object.values(journeyFixtures).forEach(fixture => {
      const best = fixture.options.best;
      const finalHolding = fixture.stages.at(-1)?.output;
      const stageContinuity = fixture.stages.slice(1).every((stage,index) => {
        const prior = fixture.stages[index]?.output;
        if (!stage.input || !prior) return true;
        return stage.input.asset === prior.asset && stage.input.network === prior.network && stage.input.address === prior.address && numeric(stage.input.amount) === numeric(prior.amount);
      });
      check(`${fixture.id}: approval network cost is nested`,fixture.fees.networkCost >= fixture.fees.approvalNetworkCost);
      check(`${fixture.id}: total cost reconciles`,Math.abs((fixture.fees.networkCost + fixture.fees.swapCost) - fixture.fees.totalCost) < .001);
      check(`${fixture.id}: expected is not below minimum`,numeric(fixture.receive.amount) >= numeric(fixture.receive.minimum));
      check(`${fixture.id}: addresses and stages persist`,Boolean(fixture.pay.fullAddress && fixture.receive.fullAddress && fixture.stages.length));
      check(`${fixture.id}: selected option matches outcome`,best.expected === fixture.receive.display && best.minimum === fixture.receive.minimum);
      check(`${fixture.id}: selected option matches costs`,Math.abs(best.totalCost-fixture.fees.totalCost)<.001 && Math.abs(best.networkCost-fixture.fees.networkCost)<.001 && Math.abs(best.swapCost-fixture.fees.swapCost)<.001 && Math.abs(best.maximumNetworkCost-fixture.fees.maximumNetworkCost)<.001);
      check(`${fixture.id}: every option reconciles`,Object.values(fixture.options).every(option=>numeric(option.expected)>=numeric(option.minimum) && Math.abs((option.networkCost+option.swapCost)-option.totalCost)<.001 && option.maximumNetworkCost>=option.networkCost));
      check(`${fixture.id}: ordered stages are continuous`,stageContinuity);
      check(`${fixture.id}: final verified holding matches outcome`,finalHolding?.asset===fixture.receive.asset && finalHolding?.network===fixture.receive.network && finalHolding?.address===fixture.receive.fullAddress && numeric(finalHolding?.amount)===numeric(fixture.receive.amount));
      check(`${fixture.id}: option metadata matches journey`,best.eta===fixture.eta && best.stages===fixture.stages.length);
      check(`${fixture.id}: native source needs no token permission`,fixture.pay.asset!=='ETH' || Object.values(fixture.options).every(option=>option.permission==='None'));
    });
    check('same-chain continuity',journeyFixtures['same-chain'].pay.network==='Ethereum' && journeyFixtures['same-chain'].receive.network==='Ethereum' && journeyFixtures['same-chain'].receive.asset==='USDC');
    check('cross-chain continuity',journeyFixtures['cross-chain'].pay.network==='Ethereum' && journeyFixtures['cross-chain'].receive.network==='Arbitrum One');

    ['same-chain','cross-chain','mixed'].forEach(id=>check(`${id}: prototype references canonical fixture`,flows.some(flow=>flow.id===id && flow.fixture===id)));
    return checks;
  }

  function renderSection() {

  function advanceCustomerFlow(action, element = null) {
    if (!state.flow) return false;
    const allowed = new Set(['resolve-entry','review-swap','start-swap','validate-recipient','review-recipient','confirm-recipient','close-panel','close-modal','open-options','select-option','use-option','modal-primary','progress-primary','navigate-activity','open-activity-item','resume-swap','timeline-continue','leave-progress','finish-swap','refresh-status','new-swap','contact-support','view-evidence','recovery-action']);
    if (!allowed.has(action)) return false;
    const flow = flows.find(item=>item.id===state.flow);
    if (!flow || state.flowStep >= flow.steps.length - 1) return false;
    if (flow.id === 'external-recipient' && action === 'confirm-recipient') {
      state.selectedRecipient={short:'0x3C44…93BC',full:state.recipientDraft || '0x3C44CdDdB6a900fa2b585dd299e03d12FA4293BC',external:true};
    }
    if (flow.id === 'different-token' && action === 'open-activity-item') {
      const item = findActivityItem(element?.dataset?.executionId || 'route_token');

    }

    if (action === 'start-swap') state.executionConsent = executionConsentFromReview(state.selectedExecutionId,flow.steps[state.flowStep]?.[2] || state.review);
    state.flowStep++;
    const nextFlowState = flow.steps[state.flowStep]?.[2];
    if (flow.id === 'refund' && nextFlowState === 'refunded') state.selectedExecutionId='route_refund_final_6c81d04ce58441d0afc2026c';
    if (flow.id === 'manual-revoke' && nextFlowState === 'approval-only') state.selectedExecutionId='route_approval_44c0d3907a664bd1a73155fa';

  function syncFlowAsyncState() {

    if (!/^0x[0-9a-fA-F]{40}$/.test(String(state.recipientDraft || '').trim())) state.recipientDraft='0x3C44CdDdB6a900fa2b585dd299e03d12FA4293BC';

  function closeCustomerSurface() {

  function rememberSurface(action, openerElement = null) {
    const snapshot = {section:state.section,pickerFamily:state.pickerFamily,pickerState:state.pickerState,progressMode:state.progressMode,progress:state.progress,activity:state.activity,activityReturnFilter:state.activityReturnFilter,recovery:state.recovery,customerSurface:state.customerSurface,selectedExecutionId:state.selectedExecutionId,activeJourney:state.activeJourney,recoveryFeedback:state.recoveryFeedback,openerAction:action,openerExecutionId:openerElement?.dataset?.executionId || ''};

  function clearSurfaceHistory() {
    state.surfaceStack.length = 0;

  function discardTopSurface() {
    state.surfaceStack.pop();
    state.surfaceReturn = state.surfaceStack.at(-1) || null;

  function quoteIntentKey() {
    return JSON.stringify({
      journey:state.activeJourney,
      amount:state.amountDraft,
      pay:state.selectedPay ? [state.selectedPay.asset,state.selectedPay.network] : null,
      receive:state.selectedReceive ? [state.selectedReceive.asset,state.selectedReceive.network] : null,
      source:state.selectedSourceAddress?.full || null,
      recipient:state.selectedRecipient?.full || null,
      option:state.selectedOption
    });
  }

  function entryOutcomeForCurrentIntent() {
    const fixture = journeyFixtures[state.activeJourney] || journeyFixtures['cross-chain'];
    const changedAsset = Boolean(
      (state.selectedPay && (state.selectedPay.asset !== fixture.pay.asset || state.selectedPay.network !== fixture.pay.network)) ||
      (state.selectedReceive && (state.selectedReceive.asset !== fixture.receive.asset || state.selectedReceive.network !== fixture.receive.network))
    );
    const amount = Number(String(state.amountDraft ?? fixture.pay.amount).replaceAll(',',''));
    if (changedAsset || !Number.isFinite(amount) || amount <= 0) return 'no-route';
    const minimum = fixture.pay.asset === 'ETH' ? .002 : 1;
    if (amount < minimum) return 'below-minimum';
    const sourceBalance = state.selectedSourceAddress?.balances?.[fixture.pay.asset]?.[0] || state.selectedSourceAddress?.balance || fixture.pay.balance;
    const balance = numericAmount(sourceBalance);
    const spendable = fixture.pay.asset === 'ETH' ? Math.max(0,balance-.009) : balance;
    if (amount > spendable) return 'insufficient';
    return state.activeJourney === 'same-chain' ? 'quoted-single' : 'quoted-multiple';
  }

  function reviewStateForCurrentIntent() {
    if (state.selectedRecipient?.external) return 'external-recipient';
    if (state.activeJourney === 'same-chain') return 'same-chain-native';
    if (state.activeJourney === 'mixed') return 'mixed-both';
    if (state.activeJourney === 'different-token') return 'fresh-recovery';
    return 'cross-chain-native';
  }

  const quoteEvaluationController = createQuoteEvaluationController({
    schedule:(callback,delay)=>setTimeout(callback,delay),
    cancelScheduled:handle=>clearTimeout(handle),
    onTransition:transition=>{
      state.quoteRevision = transition.revision;
      state.quoteIntentKey = transition.intentKey;
      const target = transition.target || state.quoteTarget;
      const checking = transition.status === 'checking';
      const failed = transition.status === 'quote-timeout' || transition.status === 'service-error';
      if (transition.intentKey !== quoteIntentKey()) {
        state.quoteIntentKey = null;
        state.intentDirty = true;
        state.pendingStartAfterRevalidation = false;
        if (target === 'review') state.review = 'revalidation-failed';
        else state.entry = 'expired';
        const staleTargetIsVisible = (target === 'entry' && state.section === 3) || (target === 'review' && state.section === 5);
        if (staleTargetIsVisible) { renderSection();announce('The swap changed before this check finished. Refresh to continue'); }

        state.review = checking ? 'revalidating' : failed ? 'revalidation-failed' : state.reviewReturnState;
      } else {
        state.entry = transition.status;
      }
      if (!checking) state.intentDirty = false;
      if (target === 'review' && failed) state.pendingStartAfterRevalidation = false;
      if (target === 'review' && !checking && !failed && state.pendingStartAfterRevalidation) {
        state.pendingStartAfterRevalidation = false;
        commitStartSwap();
        return;
      }
      const targetIsVisible = (target === 'entry' && state.section === 3) || (target === 'review' && state.section === 5);
      if (!targetIsVisible) return;
      renderSection();
      if (checking) announce(target === 'review' ? 'Checking the latest quote before you continue' : 'Checking swap options');
      else if (target === 'review' && failed) announce('The quote could not be revalidated. Try again before starting');
      else if (target === 'review') announce('The latest quote is ready to review');
      else if (transition.status === 'below-minimum') announce('The amount is below the minimum for this swap');
      else if (transition.status === 'insufficient') announce('The selected address does not have enough spendable balance for this amount');
      else announce(transition.status === 'no-route' ? 'No compatible swap is currently available for this selection' : transition.status === 'service-error' ? 'Swap options could not be checked' : transition.status === 'quote-timeout' ? 'Checking swap options timed out' : 'Updated swap options are ready');
    }
  });

  function cancelQuoteEvaluation() {
    const activeRequest = quoteEvaluationController.snapshot();
    quoteEvaluationController.cancel();
    state.quoteIntentKey = null;
    state.pendingStartAfterRevalidation = false;
    if (activeRequest?.status === 'checking') {
      if (activeRequest.target === 'review' && state.review === 'revalidating') state.review = 'revalidation-failed';
      if (activeRequest.target !== 'review' && ['checking','capabilities'].includes(state.entry)) state.entry = 'expired';
    }
  }

  function beginQuoteEvaluation(result = entryOutcomeForCurrentIntent(), options = {}) {
    state.quoteTarget = options.target || 'entry';
    state.intentDirty = true;
    if (state.quoteTarget === 'entry' && options.preserveOption !== true) {
      state.selectedOption = 'best';
      state.selectedOptionUnrankable = false;
      state.activeWarnings = [];
    }
    if (state.quoteTarget === 'review') state.reviewReturnState = options.reviewReturnState || reviewStateForCurrentIntent();
    quoteEvaluationController.begin({
      intentKey:quoteIntentKey(),
      outcome:state.quoteTarget === 'review' ? 'review-ready' : result,
      target:state.quoteTarget,
      delay:options.delay === undefined ? 450 : options.delay
    });
  }

  function beginReviewRevalidation() {
    const transientStates = ['revalidating','revalidation-failed','expired'];
    const returnState = transientStates.includes(state.review) ? state.reviewReturnState : state.review;
    state.section = 5;
    state.pendingStartAfterRevalidation = false;
    beginQuoteEvaluation('review-ready',{target:'review',reviewReturnState:returnState || reviewStateForCurrentIntent()});
  }

  function recipientValidation(value) {
    const trimmed = String(value || '').trim();
    if (/^(bc1|T[A-Za-z0-9]{20,})/i.test(trimmed)) return 'wrong-network';
    if (!/^0x[0-9a-fA-F]{40}$/.test(trimmed)) return 'invalid-syntax';
    return 'validating';
  }

  let recipientValidationRevision = 0;
  let recipientValidationHandle = null;

  function cancelRecipientValidation() {
    recipientValidationRevision += 1;
    if (recipientValidationHandle !== null) clearTimeout(recipientValidationHandle);
    recipientValidationHandle = null;
  }

  function scheduleRecipientValidation(value, flowId = null) {
    cancelRecipientValidation();
    const revision = recipientValidationRevision;
    const normalizedValue = String(value || '').trim();
    recipientValidationHandle = setTimeout(()=>{
      if (revision !== recipientValidationRevision || String(state.recipientDraft || '').trim() !== normalizedValue) return;
      recipientValidationHandle = null;
      if (flowId) {
        const flow = flows.find(item=>item.id===flowId);
        if (state.flow!==flowId || flow?.steps[state.flowStep]?.[2]!=='recipient:validating') return;
        state.flowStep += 1;
      } else {
        if (state.pickerFamily!=='recipient' || state.pickerState!=='validating') return;
        state.pickerState = 'valid';
      }
      const targetIsVisible = flowId ? state.section===9 : state.section===4;
      if (targetIsVisible) { renderSection();announce('Recipient validation completed'); }
    },450);
  }

  function hydrateFreshIntentFromHolding() {
    const item = findActivityItem(state.selectedExecutionId);
    const holding = item?.holdingData || recoveryHoldingData[state.recovery];
    if (!holding) return null;
    state.activeJourney = holding.asset === 'USDT' && holding.network === 'Arbitrum One' ? 'different-token' : state.activeJourney;
    const recoveryFixture = journeyFixtures[state.activeJourney];
    const holdingFiat = recoveryFixture?.pay.asset === holding.asset && recoveryFixture?.pay.network === holding.network ? recoveryFixture.pay.fiat : 'Price estimate unavailable';
    state.selectedPay = {asset:holding.asset,network:holding.network,balance:`${holding.amount} ${holding.asset}`,fiat:holdingFiat};
    state.selectedReceive = null;
    state.selectedSourceAddress = {label:'Recovered holding',short:holding.short,full:holding.full,balances:{[holding.asset]:[`${holding.amount} ${holding.asset}`,holdingFiat]}};
    if (state.activeJourney === 'different-token') state.selectedRecipient={short:journeyFixtures['different-token'].receive.address,full:journeyFixtures['different-token'].receive.fullAddress,external:false};
    state.amountDraft = holding.amount;
    state.selectedOption = 'best';
    state.selectedOptionUnrankable = false;
    state.activeWarnings = [];
    return holding;
  }

  function persistKeptToken() {
    const item = findActivityItem(state.selectedExecutionId);
    const holding = item?.holdingData || recoveryHoldingData[state.recovery];
    if (!item || !holding) return null;
    activityRows.attention = activityRows.attention.filter(row=>row.executionId!==item.executionId);
    if (!activityRows.completed.some(row=>row.executionId===item.executionId)) {
      activityRows.completed.unshift({
        id:`${item.id}_kept`,executionId:item.executionId,journey:item.journey,timelineKind:'different-token',timelineState:'completed',

        status:'Token kept',updated:'Just now',verifiedHolding:`${holding.amount} ${holding.asset} at ${holding.short} on ${holding.network}`
      });
    }
    return holding;
  }

  function bindConsentToExecution(consent, executionId) {
    if (!consent || typeof consent !== 'object') throw new TypeError('Reviewed consent is required');
    if (typeof executionId !== 'string' || !executionId.trim()) throw new TypeError('Full execution ID is required');
    return {...consent,executionId:executionId.trim()};
  }

  function executionConsentFromReview(executionId = null, reviewState = state.review) {
    const consent = reviewConfig(reviewState);
    const reviewedConsent = {
      fixtureId:consent.fixtureId, reviewState, payAmount:consent.payAmount,
      expected:consent.expected, minimum:consent.minimum, sourceAsset:consent.sourceAsset,
      sourceNetwork:consent.sourceNetwork, destinationAsset:consent.destinationAsset,
      destinationNetwork:consent.destinationNetwork, from:consent.from, fromFull:consent.fromFull,
      to:consent.to, toFull:consent.toFull, permission:consent.permission,
      initialProgress:consent.initialProgress, timelineKind:consent.timelineKind,totalCost:consent.totalCost,
      maxNetworkCost:consent.maxNetworkCost,sourceFiat:consent.sourceFiat,destinationFiat:consent.destinationFiat,

    const fullExecutionId = executionId || `route_live_${String(consent.fixtureId).replaceAll('-','_')}_${state.selectedOption || 'selected'}_0000000000000001`;
    return bindConsentToExecution(reviewedConsent,fullExecutionId);
  }

  function commitStartSwap() {
    const consent = reviewConfig(state.review);
    state.executionConsent = executionConsentFromReview();
    state.activeJourney = consent.fixtureId;
    cancelQuoteEvaluation();
    clearSurfaceHistory();

  function handleCustomerAction(action, element) {
    if (!action) return false;
    if (['copy-address','copy-source-address'].includes(action)) { copyValue(element.dataset.copyValue || state.selectedSourceAddress?.full || journeyFixtures[state.activeJourney]?.pay.fullAddress || journeyFixtures['cross-chain'].pay.fullAddress,'Source address'); return true; }
    if (action === 'copy-recipient') { copyValue(element.dataset.copyValue || state.selectedRecipient?.full || journeyFixtures[state.activeJourney]?.receive.fullAddress || journeyFixtures['cross-chain'].receive.fullAddress,'Recipient'); return true; }
    if (action === 'copy-holding') { copyValue(element.dataset.copyValue || 'Holding details unavailable','Holding details'); return true; }
    if (action === 'copy-contract' || action === 'copy-asset-identity') { copyValue(element.dataset.copyValue || '0xaf88d065e77c8cC2239327C5EDb3A432268e5831','Asset identity'); return true; }
    if (action === 'copy-evidence') { copyValue(element.dataset.copyValue || '0x9ba4f1e2d0027384512d0','Evidence'); return true; }
    if (state.pendingStartAfterRevalidation && ['review-back','navigate-swap','navigate-activity'].includes(action)) cancelQuoteEvaluation();

        state.recipientDraft = main.querySelector('#gus-recipient-input')?.value || state.recipientDraft;
        const validation = recipientValidation(state.recipientDraft);
        if (validation !== 'validating') { cancelRecipientValidation();state.recipientValidationState=validation; renderSection(); announce('Recipient validation failed'); return true; }
      }
      if (action === 'select-option') { state.selectedOption=element.dataset.option; state.selectedOptionUnrankable=element.dataset.unrankable==='true'; state.activeWarnings=element.dataset.warningCode?[element.dataset.warningCode]:state.selectedOptionUnrankable?['route-warning']:[]; }
      if (action === 'confirm-recipient') { state.selectedRecipient={short:'0x3C44…93BC',full:state.recipientDraft || '0x3C44CdDdB6a900fa2b585dd299e03d12FA4293BC',external:true}; }
      if (action === 'open-activity-item') { const item=findActivityItem(element.dataset.executionId); if(item){state.selectedExecutionId=item.executionId||item.id;state.activeJourney=item.journey||'cross-chain';state.executionConsent=item.consent?{...item.consent}:null;state.recovery=item.recovery||state.recovery;state.recoveryFeedback='';} }
      if (action === 'finish-swap') hydrateFreshIntentFromHolding();
      if (advanceCustomerFlow(action,element)) return true;
      state.flow = null;
      state.flowStep = 0;
      cancelQuoteEvaluation();
    }

    const opensSurface = new Set(['open-asset-picker','open-pay-asset','open-receive-asset','open-address-picker','open-recipient','open-options','request-cancel','request-stop','leave-progress','view-evidence','contact-support']);
    if (opensSurface.has(action)) {

  function cancelInspectorTransition(domain = null) {
    if (domain === null) {

      return;
    }
    const record = inspectorTransitions.get(domain);
    if (record) clearTimeout(record.handle);
    inspectorTransitions.delete(domain);
  }

  function scheduleInspectorTransition(domain, callback, delay = 650) {
    cancelInspectorTransition(domain);
    const token = {};
    const handle = setTimeout(()=>{
      if (inspectorTransitions.get(domain)?.token !== token) return;
      inspectorTransitions.delete(domain);
      callback();
    },delay);
    inspectorTransitions.set(domain,{handle,token});
  }

      const addressBalance = numericAmount(selectedBalance) || Number.POSITIVE_INFINITY;
      const available = fixture.pay.asset === 'ETH' ? Math.max(0,addressBalance-.009) : addressBalance;
      if (amount < minimum) { cancelQuoteEvaluation();state.entry='below-minimum';renderSection(); }
      else if (amount > available) { cancelQuoteEvaluation();state.entry='insufficient';renderSection(); }
      else beginQuoteEvaluation();
    }
    requestAnimationFrame(()=>{const input=main.querySelector('.wallet-amount-input');if(input){input.focus({preventScroll:true});input.setSelectionRange(value.length,value.length);}});
  });

  document.addEventListener('keydown', event => {
    const modal = main.querySelector('.wallet-modal[aria-modal="true"]');
    if (event.key === 'Escape') {
      if (modal) { event.preventDefault(); closeCustomerSurface(); return; }
      if (main.querySelector('.wallet-side-panel')) { event.preventDefault(); closeCustomerSurface(); return; }
    }
    const compositeItem = event.target instanceof Element ? event.target.closest('[role="radio"], [role="option"]') : null;
    const composite = compositeItem?.closest('[role="radiogroup"], [role="listbox"]');
    if (composite && ['ArrowDown','ArrowRight','ArrowUp','ArrowLeft','Home','End'].includes(event.key)) {
      const items = [...composite.querySelectorAll('[role="radio"]:not([disabled]), [role="option"]:not([disabled])')];
      const current = Math.max(0,items.indexOf(compositeItem));
      const forward = ['ArrowDown','ArrowRight'].includes(event.key);
      const nextIndex = event.key==='Home'?0:event.key==='End'?items.length-1:forward?(current+1)%items.length:(current-1+items.length)%items.length;
      const next = items[nextIndex];
      if (!next) return;
      event.preventDefault();
      if (next.getAttribute('role') === 'radio') {
        state.selectedOption=next.dataset.option;
        state.selectedOptionUnrankable=next.dataset.unrankable==='true';
        state.activeWarnings=next.dataset.warningCode?[next.dataset.warningCode]:state.selectedOptionUnrankable?['route-warning']:[];
        if(state.pickerState!=='all-unrankable' && state.pickerState!=='stress-128') state.pickerState='alternative';
        renderSection();
        requestAnimationFrame(()=>main.querySelector(`[role="radio"][data-option="${state.selectedOption}"]`)?.focus({preventScroll:true}));
        announce('Swap option selected');
      } else {
        items.forEach(item=>item.tabIndex=item===next?0:-1);
        next.focus({preventScroll:true});
      }
      return;
    }
    if (!modal || event.key !== 'Tab') return;
    const heading = modal.querySelector('h2[tabindex="-1"], h1[tabindex="-1"]');
    const focusable = [...modal.querySelectorAll('button:not([disabled]), input:not([disabled]), [href], [tabindex]:not([tabindex="-1"])')];
    if (heading) focusable.unshift(heading);
    if (!focusable.length) return;
    const first = focusable[0], last = focusable[focusable.length-1];
    if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
    else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
  });

  themeSelect.addEventListener('change',()=>updateState('theme',themeSelect.value));
  viewportSelect.addEventListener('change',()=>updateState('viewport',viewportSelect.value));
  scaleSelect.addEventListener('change',()=>updateState('scale',scaleSelect.value));
  motionSelect.addEventListener('change',()=>updateState('motion',motionSelect.value));
  window.addEventListener('resize',fitPreviewFrames);

  renderTabs();
  syncControls();
  renderSection();
})();
</script>
