name: Build Linux Dekstop in Docker
# Note: This workflow almost entirely mirrors the existing Jenkins Pipeline.

on:
  pull_request:
    branches:
      [
        dev,
        main,
        release/*,
        hotfix/*,
        bugfix/*,
        feature/*,
        chore/*,
        build/*,
        ci/*,
      ]
    paths:
      - ".docker/**"
      - "docs/LIFI_*BUILD_DEFINES.json"
      - "tool/lifi_build_config.py"
      - "linux/**"
      - "pubspec.yaml"
      - "pubspec.lock"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux-docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Select public LI.FI profile
        id: lifi_profile
        uses: ./.github/actions/lifi-profile
        with:
          requested: production

      - name: Build Linux Desktop
        id: build_linux
        env:
          GITHUB_API_PUBLIC_READONLY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LIFI_BUILD_ENVIRONMENT: ${{ steps.lifi_profile.outputs.environment }}
          # Optional feedback provider secrets to embed dart-defines
          TRELLO_API_KEY: ${{ secrets.TRELLO_API_KEY }}
          TRELLO_TOKEN: ${{ secrets.TRELLO_TOKEN }}
          TRELLO_BOARD_ID: ${{ secrets.TRELLO_BOARD_ID }}
          TRELLO_LIST_ID: ${{ secrets.TRELLO_LIST_ID }}
          FEEDBACK_API_KEY: ${{ secrets.FEEDBACK_API_KEY }}
          FEEDBACK_PRODUCTION_URL: ${{ secrets.FEEDBACK_PRODUCTION_URL }}
          MATOMO_URL: ${{ secrets.MATOMO_URL }}
          MATOMO_SITE_ID: ${{ secrets.MATOMO_SITE_ID }}
        run: |
          chmod +x .docker/build.sh
          sh .docker/build.sh linux release

      - name: Compute short commit SHA
        id: vars
        shell: bash
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Upload Linux bundle artifact
        id: upload_artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: komodo-wallet-linux-docker-${{ steps.vars.outputs.short_sha }}-${{ steps.lifi_profile.outputs.environment }}.zip
          path: build/linux/x64/release/bundle/*
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

      - name: Attach public build provenance
        uses: ./.github/actions/build-provenance
        with:
          environment: ${{ steps.lifi_profile.outputs.environment }}
          artifact_path: build/linux/x64/release/bundle/*
          artifact_name: komodo-wallet-linux-docker-${{ steps.vars.outputs.short_sha }}-${{ steps.lifi_profile.outputs.environment }}.zip
