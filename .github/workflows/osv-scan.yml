name: Vulnerability Scan
run-name: ${{ github.actor }} is scanning dependencies for vulnerabilities 🔒

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  osv_scan:
    # Pin the official reusable workflow. Scanning only the shipped Flutter
    # dependency lock avoids treating the broad, non-production browser-QA
    # requirements manifest as a resolvable lockfile (which previously spent
    # 25 minutes backtracking, then exited 127 without reporting a finding).
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
    with:
      scan-args: |-
        --lockfile=pubspec.lock
    permissions:
      actions: read
      contents: read
      security-events: write
