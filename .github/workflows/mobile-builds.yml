name: Mobile Builds
run-name: Building mobile apps 📱

on:
  pull_request:
    branches: [dev, main, feat/solana-integration, release/*, hotfix/*, feature/*]
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

env:
  TRON_GASLESS_MAINNET_BASE_URL: "https://quicknode.gleec.com/gasfree/tron"
  TRON_GASLESS_MAINNET_SERVICE_PROVIDER: "TLntW9Z59LYY5KEi9cmwk3PKjQga828ird"

jobs:
  build_mobile:
    name: Build Mobile (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: iOS
            runner: macos-latest
            build_command: flutter build ios --no-pub --release --no-codesign
            artifact_path: build/ios/iphoneos/Runner.app
            artifact_name: komodo-wallet-ios-unsigned.app
          - platform: Android
            runner: ubuntu-latest
            build_command: flutter build apk --no-pub --release
            artifact_path: build/app/outputs/flutter-apk/app-release.apk
            artifact_name: komodo-wallet-android-unsigned.apk

    steps:
      - name: Checkout code
        id: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      - name: Select public LI.FI profile
        id: lifi_profile
        uses: ./.github/actions/lifi-profile
        with:
          requested: production

      - name: Install Flutter and dependencies
        id: install_flutter
        uses: ./.github/actions/flutter-deps

      - name: Setup iOS environment
        id: setup_ios
        if: ${{ matrix.platform == 'iOS' }}
        uses: ./.github/actions/releases/setup-ios
        with:
          p12-file-base64: ${{ secrets.IOS_P12_BASE64 }}
          p12-password: ${{ secrets.IOS_P12_PASSWORD }}
          bundle-id: "com.GleecDEX.wallet"
          profile-type: "IOS_APP_STORE"
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_PRIVATE_KEY }}

      - name: Setup Android environment
        id: setup_android
        if: ${{ matrix.platform == 'Android' }}
        uses: ./.github/actions/releases/setup-android
        with:
          keystore-base64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          key-alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          store-password: ${{ secrets.ANDROID_STORE_PASSWORD }}
          key-password: ${{ secrets.ANDROID_KEY_PASSWORD }}

      # Flutter build with `--no-pub` flag fails on Android due to a
      # known regression with the build system in 3.32.5.
      # https://github.com/flutter/flutter/issues/169336
      # Run config-only before the full double-build to ensure success.
      - name: Temporary workaround for Android build issue
        id: android_workaround
        if: ${{ matrix.platform == 'Android' }}
        run: |
          flutter build apk --config-only

      - name: Fetch packages, generate assets, and build for ${{ matrix.platform }}
        id: build
        env:
          GITHUB_API_PUBLIC_READONLY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        uses: ./.github/actions/generate-assets
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRELLO_API_KEY: ${{ secrets.TRELLO_API_KEY }}
          TRELLO_TOKEN: ${{ secrets.TRELLO_TOKEN }}
          TRELLO_BOARD_ID: ${{ secrets.TRELLO_BOARD_ID }}
          TRELLO_LIST_ID: ${{ secrets.TRELLO_LIST_ID }}
          FEEDBACK_API_KEY: ${{ secrets.FEEDBACK_API_KEY }}
          FEEDBACK_PRODUCTION_URL: ${{ secrets.FEEDBACK_PRODUCTION_URL }}
          MATOMO_URL: ${{ secrets.MATOMO_URL }}
          MATOMO_SITE_ID: ${{ secrets.MATOMO_SITE_ID }}
          BUILD_COMMAND: ${{ matrix.build_command }}
          LIFI_BUILD_ENVIRONMENT: ${{ steps.lifi_profile.outputs.environment }}
          TRON_GASLESS_ENABLED: "true"
          TRON_GASLESS_RECEIVE_ENABLED: "true"
          TRON_GASLESS_BASE_URL: ${{ env.TRON_GASLESS_MAINNET_BASE_URL }}
          TRON_GASLESS_SERVICE_PROVIDER: ${{ env.TRON_GASLESS_MAINNET_SERVICE_PROVIDER }}
          TRON_GASLESS_REQUIRED_NETWORK: "tron"

      - name: Compute short commit SHA
        id: vars
        shell: bash
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        id: upload_artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact_name }}-${{ steps.vars.outputs.short_sha }}-${{ steps.lifi_profile.outputs.environment }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

      - name: Attach public build provenance
        uses: ./.github/actions/build-provenance
        with:
          environment: ${{ steps.lifi_profile.outputs.environment }}
          artifact_path: ${{ matrix.artifact_path }}
          artifact_name: ${{ matrix.artifact_name }}-${{ steps.vars.outputs.short_sha }}-${{ steps.lifi_profile.outputs.environment }}
