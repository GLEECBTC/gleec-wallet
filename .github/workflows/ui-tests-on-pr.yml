# Runs UI tests on PRs to ensure the app is working as expected
name: UI Integration tests on PR
run-name: ${{ github.actor }} is running UI tests on PR 🚀

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  ui_tests:
    name: Test ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # Raised from 45. With a counterparty on the book the taker no longer fails
    # on a missing row in seconds - it performs a real atomic swap, which the
    # test allows fifteen minutes for, and only then do misc_tests and
    # fiat_onramp_tests run at all. Those two sit behind dex_tests in a
    # sequential runner that throws out of the loop on failure, so they have
    # not executed on any branch since 2026-08-12 and their cost is unmeasured.
    timeout-minutes: 75
    strategy:
      fail-fast: false

      matrix:
        name: [web-app-linux-profile, web-app-macos]
        include:
          - name: web-app-linux-profile
            os: ubuntu-latest
            browser: chrome
            kdf_platform: linux
            # A reserved wallet of its own: the two legs run at the same time and
            # would otherwise place orders from one wallet and spend one balance.
            counterparty_slot: 0
            display: "headless"
            resolution: "1600,1024"
            mode: profile
            # memory_profile.json should be generated in profile mode
            driver_logs: |
              ./*.log
              ./memory_profile.json

          - name: web-app-macos
            os: macos-latest
            browser: safari
            kdf_platform: macos
            counterparty_slot: 1
            display: "headless" # has no affect with safaridriver
            resolution: "1600,1024" # has no affect with safaridriver
            mode: release
            driver_logs: |
              ./*.log
              ~/Library/Logs/com.apple.WebDriver/**/*.log
              ~/Library/Logs/com.apple.WebDriver/**/*.txt

    steps:
      - name: Setup GH Actions
        id: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      # Flutter integration test setup
      - name: Install Chrome and chromedriver
        id: setup_chrome
        if: ${{ matrix.browser == 'chrome' }}
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2
        with:
          chrome-version: stable
          install-chromedriver: true
          install-dependencies: true

      - name: Print Chrome setup
        id: print_chrome_setup
        if: ${{ matrix.browser == 'chrome' }}
        run: |
          echo "Chrome path: ${{ steps.setup_chrome.outputs.chrome-path }}"
          "${{ steps.setup_chrome.outputs.chrome-path }}" --version
          echo "ChromeDriver path: ${{ steps.setup_chrome.outputs.chromedriver-path }}"
          "${{ steps.setup_chrome.outputs.chromedriver-path }}" --version

      - name: Enable safaridriver (sudo) (MacOS)
        id: enable_safari
        if: ${{ matrix.browser == 'safari' }}
        timeout-minutes: 1
        run: |
          defaults write com.apple.Safari IncludeDevelopMenu YES
          defaults write com.apple.Safari AllowRemoteAutomation 1
          sudo /usr/bin/safaridriver --enable || echo "Failed to enable safaridriver!"

      - name: Install Flutter and dependencies
        id: install_flutter
        uses: ./.github/actions/flutter-deps

      - name: Fetch packages and generate assets
        id: generate_assets
        uses: ./.github/actions/generate-assets
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate build
        id: validate_build
        uses: ./.github/actions/validate-build

      # The taker half of dex_tests buys MARTY, and nothing on the testnet sells
      # it. The maker half's own order is the only other one in the book, and it
      # belongs to the same wallet on the same node, so the self-trade guard
      # refuses it - which is why these jobs have been red on every branch since
      # 2026-08-12. This starts a second KDF on a reserved funded wallet so a
      # real order exists to take. It is the same KDF build the app ships,
      # pinned by build_config.json, and the order reaches the app over p2p
      # rather than being stubbed.
      - name: Fetch the KDF binary for the counterparty
        id: counterparty_binary
        if: ${{ !startsWith(github.head_ref, 'auth/') }}
        run: |
          set -euo pipefail
          # Use the SDK's manifest selectors and complete checksum/provenance
          # checks. Archive naming can change without changing the KDF commit.
          dart tool/prefetch_native_kdf.dart "${{ matrix.kdf_platform }}"
          BINARY="sdk/packages/komodo_defi_framework/${{ matrix.kdf_platform }}/bin/kdf"
          mkdir -p .counterparty
          install -m 0755 "$BINARY" .counterparty/kdf
          echo "path=$(pwd)/.counterparty/kdf" >> "$GITHUB_OUTPUT"

      - name: Start the DEX counterparty
        id: counterparty
        if: ${{ !startsWith(github.head_ref, 'auth/') }}
        run: |
          set -euo pipefail
          : > counterparty.log
          # Invoked the way run_integration_tests.dart already is in this
          # workflow - a direct file run rather than `dart run`, which resolves
          # the package and can re-enter pub on a lockfile-enforced checkout.
          nohup dart tool/dex_counterparty.dart \
            --kdf "${{ steps.counterparty_binary.outputs.path }}" \
            --slot ${{ matrix.counterparty_slot }} \
            --rpc-port 779${{ matrix.counterparty_slot }} \
            >> counterparty.log 2>&1 &
          CP_PID=$!
          echo "pid=${CP_PID}" >> "$GITHUB_OUTPUT"
          # Waits for the order to be readable on its own book, not merely for
          # setprice to be accepted. An order that never reaches the book leaves
          # the suite waiting on a row that is not coming.
          for i in $(seq 1 60); do
            if grep -q DEX_COUNTERPARTY_READY counterparty.log; then
              echo "Counterparty ready after $((i * 10))s"
              cat counterparty.log
              exit 0
            fi
            if ! kill -0 "${CP_PID}" 2>/dev/null; then
              echo "Counterparty exited before it was ready"
              cat counterparty.log
              exit 1
            fi
            sleep 10
          done
          echo "Counterparty did not become ready within 10 minutes"
          cat counterparty.log
          exit 1

      # Run integration tests
      - name: Test air_dex ${{ matrix.browser }}
        id: integration_tests
        continue-on-error: true
        env:
          GITHUB_API_PUBLIC_READONLY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHROME_EXECUTABLE: ${{ matrix.browser == 'chrome' && steps.setup_chrome.outputs.chrome-path || '' }}
          ONBOARDING_ONLY: ${{ startsWith(github.head_ref, 'auth/') }}
        run: |
          # Runners hold no geo policy credential and cannot reach the policy
          # service, so the lookup fails and the activation gate defers every
          # asset: a coin enabled by a test never activates and never reaches
          # the wallet list. These suites exercise wallet flows, not region
          # blocking. This define lives only in this integration-test build -
          # release builds keep the gate and are unaffected.
          # Authentication candidates use disposable unfunded wallets. The
          # live-funds trading round stays with the manual release checklist.
          auth_args=()
          if [[ "$ONBOARDING_ONLY" == "true" ]]; then
            auth_args=(-t wallets_manager_tests/wallets_manager_tests.dart)
          fi
          dart run_integration_tests.dart "${auth_args[@]}" \
            -d ${{ matrix.display }} \
            -b ${{ matrix.resolution }} \
            -n ${{ matrix.browser }} \
            -m ${{ matrix.mode }} \
            --dart-define GEO_BLOCK=disabled

      - name: Stop the DEX counterparty
        if: ${{ always() && !startsWith(github.head_ref, 'auth/') }}
        run: |
          pkill -f dex_counterparty.dart || true
          pkill -f '\.counterparty/kdf' || true
          # Give it a moment to cancel its orders rather than leaving them on
          # the book for the next run to trip over.
          sleep 5
          echo '--- counterparty log ---'
          cat counterparty.log || true

      # Post-test steps (upload logs, coverage, and failure check)
      - name: Upload driver logs
        id: upload_logs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ runner.os }}-${{ matrix.browser }}-logs
          path: ${{ matrix.driver_logs }}
          if-no-files-found: warn

      # TODO: re-enable once integration test coverage is fixed.
      # there are errors related to Hive and other storage providers
      # that will likely need to be mocked to support the new
      # flutter integration test structure (flutter drive is deprecated)
      # - name: Generate coverage report
      #   if: ${{ matrix.browser == 'chrome' }}
      #   continue-on-error: true
      #   uses: ./.github/actions/code-coverage
      #   with:
      #     test_file: 'test_integration'

      - name: Fail workflow if tests failed
        id: check_test_result
        if: ${{ steps.integration_tests.outcome == 'failure' }}
        run: exit 1
