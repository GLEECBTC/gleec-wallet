# Deploy a preview build with SDK integration for testing KDF API changes
name: Deploy SDK Integration Preview
run-name: ${{ github.actor }} is deploying SDK ${{ inputs.sdk_commit_sha }} with KDF ${{ inputs.kdf_commit_sha }} 🚀

on:
  workflow_dispatch:
    inputs:
      sdk_commit_sha:
        description: "Full 40-character SDK commit SHA"
        required: true
        type: string
      kdf_commit_sha:
        description: "Full 40-character KDF artifact commit SHA pinned by the SDK"
        required: true
        type: string

jobs:
  build_and_preview:
    runs-on: ubuntu-latest
    outputs:
      preview_url: ${{ steps.firebase_deploy.outputs.details_url }}
      channel_id: ${{ steps.get_preview_channel_id.outputs.preview_channel_id }}

    steps:
      - name: Setup GH Actions
        id: checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Checkout exact SDK commit
        id: checkout_sdk_commit
        shell: bash
        env:
          SDK_COMMIT_SHA: ${{ inputs.sdk_commit_sha }}
        run: |
          if [[ ! "$SDK_COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "SDK commit must be a full lowercase 40-character SHA." >&2
            exit 1
          fi

          git -C sdk fetch --no-tags origin "$SDK_COMMIT_SHA"
          git -C sdk checkout --detach "$SDK_COMMIT_SHA"

          checked_out_sha="$(git -C sdk rev-parse HEAD)"
          if [[ "$checked_out_sha" != "$SDK_COMMIT_SHA" ]]; then
            echo "SDK checkout mismatch: expected $SDK_COMMIT_SHA, got $checked_out_sha." >&2
            exit 1
          fi

          if [[ -n "$(git -C sdk status --porcelain)" ]]; then
            echo "Exact SDK checkout is not clean." >&2
            git -C sdk status --short
            exit 1
          fi

          echo "Verified detached SDK commit $checked_out_sha."

      - name: Verify immutable KDF artifact manifest
        id: verify_kdf_artifact_manifest
        shell: bash
        env:
          KDF_COMMIT_SHA: ${{ inputs.kdf_commit_sha }}
        run: |
          if [[ ! "$KDF_COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "KDF commit must be a full lowercase 40-character SHA." >&2
            exit 1
          fi

          manifest="sdk/packages/komodo_defi_framework/app_build/build_config.json"
          if [[ ! -f "$manifest" ]]; then
            echo "KDF artifact manifest is missing: $manifest" >&2
            exit 1
          fi

          jq -e --arg kdf_sha "$KDF_COMMIT_SHA" '
            .api.api_commit_hash == $kdf_sha
            and (.api.api_commit_hash | test("^[0-9a-f]{40}$"))
            and .api.fetch_at_build_enabled == true
            and (.api.source_urls | type == "array" and length > 0)
            and all(
              .api.source_urls[];
              . == "https://api.github.com/repos/GLEECBTC/komodo-defi-framework"
              or . == "https://devbuilds.gleec.com"
              or . == "https://nebula.decker.im"
            )
            and (
              .api.platforms | keys | sort
              == ["android-aarch64", "android-armv7", "ios", "linux", "macos", "web", "windows"]
            )
            and all(
              .api.platforms[];
              (.matching_pattern | type == "string" and length > 0)
              and (.path | type == "string" and length > 0)
              and (.valid_zip_sha256_checksums | type == "array")
              and (.valid_zip_sha256_checksums | length > 0)
              and all(
                .valid_zip_sha256_checksums[];
                test("^[0-9a-f]{64}$")
              )
            )
          ' "$manifest" >/dev/null || {
            pinned_sha="$(jq -r '.api.api_commit_hash // "missing"' "$manifest")"
            echo "KDF artifact manifest validation failed (requested $KDF_COMMIT_SHA, pinned $pinned_sha)." >&2
            exit 1
          }

          git -C sdk diff --exit-code -- packages/komodo_defi_framework/app_build/build_config.json
          echo "Verified immutable KDF artifact manifest for $KDF_COMMIT_SHA."

      - name: Get Preview Channel ID
        id: get_preview_channel_id
        shell: bash
        env:
          SDK_COMMIT_SHA: ${{ inputs.sdk_commit_sha }}
          KDF_COMMIT_SHA: ${{ inputs.kdf_commit_sha }}
        run: |
          channel_id="sdk-integration-${SDK_COMMIT_SHA:0:7}-${KDF_COMMIT_SHA:0:7}-${GITHUB_SHA:0:7}"
          echo "preview_channel_id=$channel_id" >> "$GITHUB_OUTPUT"

      - name: Install Flutter and dependencies
        id: install_flutter
        uses: ./.github/actions/flutter-deps

      - name: Fetch packages and generate assets
        id: generate_assets
        uses: ./.github/actions/generate-assets
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Profile mode keeps mock card data out of production release builds.
          BUILD_COMMAND: >-
            flutter build web --no-pub --profile
            --dart-define=CARD_FEATURE_ENABLED=true
            --dart-define=GNOSIS_CARD_MODE=mock
          # Optionally provide feedback service configuration if available
          FEEDBACK_API_KEY: ${{ secrets.FEEDBACK_API_KEY }}
          FEEDBACK_PRODUCTION_URL: ${{ secrets.FEEDBACK_PRODUCTION_URL }}
          TRELLO_API_KEY: ${{ secrets.TRELLO_API_KEY }}
          TRELLO_TOKEN: ${{ secrets.TRELLO_TOKEN }}
          TRELLO_BOARD_ID: ${{ secrets.TRELLO_BOARD_ID }}
          TRELLO_LIST_ID: ${{ secrets.TRELLO_LIST_ID }}
          # Matomo analytics configuration (optional). If not provided, analytics will be disabled in CI.
          MATOMO_URL: ${{ secrets.MATOMO_URL }}
          MATOMO_SITE_ID: ${{ secrets.MATOMO_SITE_ID }}

      - name: Validate build
        id: validate_build
        uses: ./.github/actions/validate-build

      - name: Deploy SDK Integration Preview (Expires in 7 days)
        id: firebase_deploy
        uses: ./.github/actions/firebase-hosting-deploy
        with:
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_KOMODO_WALLET_OFFICIAL }}"
          channelId: "${{ steps.get_preview_channel_id.outputs.preview_channel_id }}"
          target: walletrc
          expires: 7d
          projectId: komodo-wallet-official

      - name: Display deployment information
        id: display_info
        shell: bash
        env:
          SDK_COMMIT_SHA: ${{ inputs.sdk_commit_sha }}
          KDF_COMMIT_SHA: ${{ inputs.kdf_commit_sha }}
        run: |
          echo "🚀 SDK Integration Preview deployed successfully!"
          echo "📦 SDK Commit: $SDK_COMMIT_SHA"
          echo "🔧 KDF Commit: $KDF_COMMIT_SHA"
          echo "🏷 Channel ID: ${{ steps.get_preview_channel_id.outputs.preview_channel_id }}"
          echo "🌐 Preview URL: ${{ steps.firebase_deploy.outputs.details_url }}"
          echo "⏰ Preview expires in 7 days"
          echo ""
          echo "You can access your preview at:"
          echo "${{ steps.firebase_deploy.outputs.details_url }}"
