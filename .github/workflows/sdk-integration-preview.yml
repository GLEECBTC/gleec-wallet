# Deploy a preview build with SDK integration for testing KDF API changes
name: Deploy SDK Integration Preview
run-name: ${{ github.actor }} is deploying SDK integration preview with API branch '${{ inputs.api_branch }}' 🚀

on:
  workflow_dispatch:
    inputs:
      api_branch:
        description: "API branch name to update KDF configuration"
        required: true
        default: "feat/tron-gasfree"
        type: string
      api_commit:
        description: "Immutable 40-character KDF source commit"
        required: true
        default: "bd413dcfea73c9de2e85903323946a378b180fa7"
        type: string
      sdk_branch:
        description: "SDK branch containing the immutable SDK commit"
        required: true
        default: "add/tron-gas-free"
        type: string
      sdk_commit:
        description: "Immutable 40-character SDK commit belonging to the requested branch"
        required: true
        type: string

concurrency:
  group: sdk-integration-preview-${{ github.sha }}-${{ inputs.sdk_commit }}
  cancel-in-progress: true

jobs:
  build_and_preview:
    runs-on: ubuntu-latest
    outputs:
      preview_url: ${{ steps.firebase_deploy.outputs.details_url }}
      channel_id: ${{ steps.get_preview_channel_id.outputs.preview_channel_id }}
      sdk_sha: ${{ steps.update_sdk_branch.outputs.sdk_sha }}

    steps:
      - name: Validate requested branches
        shell: bash
        env:
          API_BRANCH: ${{ inputs.api_branch }}
          API_COMMIT: ${{ inputs.api_commit }}
          SDK_BRANCH: ${{ inputs.sdk_branch }}
          SDK_COMMIT: ${{ inputs.sdk_commit }}
        run: |
          if ! git check-ref-format --branch "$API_BRANCH" >/dev/null; then
            echo "Invalid API branch name."
            exit 1
          fi
          if ! git check-ref-format --branch "$SDK_BRANCH" >/dev/null; then
            echo "Invalid SDK branch name."
            exit 1
          fi
          if [[ ! "$API_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid immutable KDF source commit."
            exit 1
          fi
          if [[ ! "$SDK_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid immutable SDK commit."
            exit 1
          fi
          if [ "$API_BRANCH" != "feat/tron-gasfree" ] ||
            [ "$API_COMMIT" != "bd413dcfea73c9de2e85903323946a378b180fa7" ]; then
            echo "This preview is bound to the approved feat/tron-gasfree KDF release."
            exit 1
          fi

      - name: Shortify commit sha
        id: shortify_commit
        shell: bash
        run: echo "sha_short=$(echo ${GITHUB_SHA::7})" >> $GITHUB_OUTPUT

      - name: Get branch
        id: get_branch
        shell: bash
        run: echo "ref_short=$(echo ${GITHUB_REF##*/})" >> $GITHUB_OUTPUT

      - name: Get Preview Channel ID
        id: get_preview_channel_id
        shell: bash
        env:
          API_BRANCH: ${{ inputs.api_branch }}
          SDK_COMMIT: ${{ inputs.sdk_commit }}
        run: |
          api_slug=$(
            printf '%s' "$API_BRANCH" |
              tr '[:upper:]' '[:lower:]' |
              sed -E 's/[^a-z0-9-]+/-/g; s/^-+//; s/-+$//; s/-+/-/g' |
              cut -c1-24 |
              sed -E 's/-+$//'
          )
          if [ -z "$api_slug" ]; then
            echo "API branch does not produce a valid preview channel name."
            exit 1
          fi
          printf 'preview_channel_id=sdk-integration-%s-%s-%s\n' \
            "$api_slug" "${GITHUB_SHA::7}" "${SDK_COMMIT::7}" \
            >> "$GITHUB_OUTPUT"

      - name: Setup GH Actions
        id: checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Flutter and Dart toolchains
        id: install_flutter
        uses: ./.github/actions/flutter-deps

      - name: Update SDK to specified branch
        id: update_sdk_branch
        shell: bash
        env:
          SDK_BRANCH: ${{ inputs.sdk_branch }}
          SDK_COMMIT: ${{ inputs.sdk_commit }}
        run: |
          echo "Resolving the immutable SDK commit on the requested branch"
          git -C sdk fetch --no-tags origin \
            "+refs/heads/$SDK_BRANCH:refs/remotes/origin/$SDK_BRANCH"
          resolved_sdk_sha=$(git -C sdk rev-parse "$SDK_COMMIT^{commit}")
          if [ "$resolved_sdk_sha" != "$SDK_COMMIT" ]; then
            echo "SDK commit did not resolve to the exact requested SHA."
            exit 1
          fi
          if ! git -C sdk merge-base --is-ancestor \
            "$resolved_sdk_sha" "refs/remotes/origin/$SDK_BRANCH"; then
            echo "The requested SDK commit does not belong to the requested SDK branch."
            exit 1
          fi
          git -C sdk checkout --detach "$resolved_sdk_sha"
          if [ "$(git -C sdk rev-parse HEAD)" != "$resolved_sdk_sha" ]; then
            echo "SDK detached checkout did not retain the requested commit."
            exit 1
          fi
          printf 'sdk_sha=%s\n' "$resolved_sdk_sha" >>"$GITHUB_OUTPUT"
          printf 'Resolved SDK SHA: `%s`\n' "$resolved_sdk_sha" >>"$GITHUB_STEP_SUMMARY"
          echo "SDK updated to the verified detached commit"
          ls -la sdk/

      - name: Update KDF API configuration
        id: update_kdf_config
        shell: bash
        env:
          API_BRANCH: ${{ inputs.api_branch }}
          API_COMMIT: ${{ inputs.api_commit }}
        run: |
          echo "Updating KDF API configuration for the requested branch"
          cd sdk

          # Check if the update script exists
          if [ -f "packages/komodo_wallet_cli/bin/update_api_config.dart" ]; then
            echo "Running update_api_config.dart script..."
            # Install dart dependencies first
            cd packages/komodo_wallet_cli
            dart pub get
            cd ../..
            
            # Resolve the branch commit and require a complete mirror-matched
            # artifact set in the canonical SDK manifest.
            dart run packages/komodo_wallet_cli/bin/update_api_config.dart \
              --branch "$API_BRANCH" \
              --commit "$API_COMMIT" \
              --source mirror \
              --mirror-url https://devbuilds.gleec.com \
              --platform all \
              --config packages/komodo_defi_framework/app_build/build_config.json \
              --output-dir packages/komodo_defi_framework/app_build/temp_downloads \
              --strict \
              --verbose
            echo "KDF API configuration updated successfully"
          else
            echo "KDF API configuration updater is missing."
            echo "Available files in packages/komodo_wallet_cli/bin/:"
            ls -la packages/komodo_wallet_cli/bin/ || echo "Directory not found"
            exit 1
          fi

      - name: Verify exact GasFree release provenance
        id: verify_gasfree_provenance
        shell: bash
        env:
          API_BRANCH: ${{ inputs.api_branch }}
          API_COMMIT: ${{ inputs.api_commit }}
          SDK_BRANCH: ${{ inputs.sdk_branch }}
          SDK_SHA: ${{ steps.update_sdk_branch.outputs.sdk_sha }}
        run: |
          .github/scripts/verify_gasfree_preview_provenance.sh \
            --api-branch "$API_BRANCH" \
            --api-commit "$API_COMMIT" \
            --sdk-branch "$SDK_BRANCH" \
            --sdk-commit "$SDK_SHA" \
            --sdk-repo sdk \
            --config sdk/packages/komodo_defi_framework/app_build/build_config.json

          provenance_file="$RUNNER_TEMP/gasfree-preview-provenance.txt"
          {
            printf 'wallet_commit=%s\n' "$GITHUB_SHA"
            printf 'sdk_branch=%s\n' "$SDK_BRANCH"
            printf 'sdk_commit=%s\n' "$SDK_SHA"
            printf 'kdf_branch=%s\n' "$API_BRANCH"
            printf 'kdf_commit=%s\n' "$API_COMMIT"
            printf '%s\n' \
              'web=9242cbba06eda6e82fc057897781cea2adf85f67f0cf5710f4feaf0a5e6d844c' \
              'ios=0cc494a8ff7b3f926cebc6956cda61c9928c7366624d592c71e29f080a3255bd' \
              'macos=f1d8a52c7c34d9721761733586f7262177b5362f911d8a220b2550e1f9844bbe' \
              'android-armv7=929d57312908544c9e6ae94d660d8ae14c21fb84547821ba0e0aba26c4daf29a' \
              'android-aarch64=9953572e03956a751dcef365df76b6b84a3675800323220d50409dbd8175f037' \
              'linux=ec5e2c801520e00ed1fd18c82c0edc0ade30716c6a4fb8aab453f265ce6afb33' \
              'windows=04062cf1a271888eab9a757fa1a19e41038beea15b19484a21e5731d4dfc05e0'
          } >"$provenance_file"
          printf 'provenance_file=%s\n' "$provenance_file" >>"$GITHUB_OUTPUT"
          {
            printf 'KDF release: `%s` at `%s`\n\n' "$API_BRANCH" "$API_COMMIT"
            printf 'The exact seven checked-in artifact digests were verified before build.\n'
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Persist preview provenance
        uses: actions/upload-artifact@v4
        with:
          name: gasfree-preview-provenance-${{ github.sha }}
          path: ${{ steps.verify_gasfree_provenance.outputs.provenance_file }}
          if-no-files-found: error
          retention-days: 7

      - name: Update pubspec.yaml to use local SDK paths
        id: update_pubspec
        shell: bash
        run: |
          echo "Updating pubspec.yaml files to use local SDK paths..."

          # Update main pubspec.yaml
          echo "Updating main pubspec.yaml..."
          sed -i 's|komodo_cex_market_data:.*|komodo_cex_market_data:|' pubspec.yaml
          sed -i '/komodo_cex_market_data:/,/ref: dev/c\
            komodo_cex_market_data:\
              path: sdk/packages/komodo_cex_market_data' pubspec.yaml

          sed -i 's|komodo_defi_sdk:.*|komodo_defi_sdk:|' pubspec.yaml
          sed -i '/komodo_defi_sdk:/,/ref: dev/c\
            komodo_defi_sdk:\
              path: sdk/packages/komodo_defi_sdk' pubspec.yaml

          sed -i 's|komodo_defi_types:.*|komodo_defi_types:|' pubspec.yaml
          sed -i '/komodo_defi_types:/,/ref: dev/c\
            komodo_defi_types:\
              path: sdk/packages/komodo_defi_types' pubspec.yaml

          sed -i 's|komodo_ui:.*|komodo_ui:|' pubspec.yaml
          sed -i '/komodo_ui:/,/ref: dev/c\
            komodo_ui:\
              path: sdk/packages/komodo_ui' pubspec.yaml

          # Update komodo_ui_kit pubspec.yaml
          echo "Updating packages/komodo_ui_kit/pubspec.yaml..."
          sed -i 's|komodo_defi_types:.*|komodo_defi_types:|' packages/komodo_ui_kit/pubspec.yaml
          sed -i '/komodo_defi_types:/,/ref: dev/c\
            komodo_defi_types:\
              path: ../../sdk/packages/komodo_defi_types' packages/komodo_ui_kit/pubspec.yaml

          sed -i 's|komodo_ui:.*|komodo_ui:|' packages/komodo_ui_kit/pubspec.yaml
          sed -i '/komodo_ui:/,/ref: dev/c\
            komodo_ui:\
              path: ../../sdk/packages/komodo_ui' packages/komodo_ui_kit/pubspec.yaml

          echo "Pubspec.yaml files updated successfully"

          # Show the changes made
          echo "=== Main pubspec.yaml SDK dependencies ==="
          grep -A2 -B1 "komodo_.*:" pubspec.yaml | grep -A2 -B1 "path: sdk"

          echo "=== UI Kit pubspec.yaml SDK dependencies ==="
          grep -A2 -B1 "komodo_.*:" packages/komodo_ui_kit/pubspec.yaml | grep -A2 -B1 "path: ../../sdk"

      - name: Fetch packages and generate assets
        id: generate_assets
        uses: ./.github/actions/generate-assets
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optionally provide feedback service configuration if available
          FEEDBACK_API_KEY: ${{ secrets.FEEDBACK_API_KEY }}
          FEEDBACK_PRODUCTION_URL: ${{ secrets.FEEDBACK_PRODUCTION_URL }}
          TRELLO_API_KEY: ${{ secrets.TRELLO_API_KEY }}
          TRELLO_TOKEN: ${{ secrets.TRELLO_TOKEN }}
          TRELLO_BOARD_ID: ${{ secrets.TRELLO_BOARD_ID }}
          TRELLO_LIST_ID: ${{ secrets.TRELLO_LIST_ID }}
          # Matomo analytics configuration (optional). If not provided, analytics will be disabled in CI.
          MATOMO_URL: ${{ secrets.MATOMO_URL }}
          MATOMO_SITE_ID: ${{ secrets.MATOMO_SITE_ID }}
          TRON_GASLESS_ENABLED: "true"
          TRON_GASLESS_RECEIVE_ENABLED: ${{ vars.TRON_GASLESS_RECEIVE_ENABLED || 'false' }}
          TRON_GASLESS_BASE_URL: ${{ vars.TRON_GASLESS_BASE_URL }}
          TRON_GASLESS_SERVICE_PROVIDER: ${{ vars.TRON_GASLESS_SERVICE_PROVIDER }}
          TRON_GASLESS_CONTROL_URL: ${{ vars.TRON_GASLESS_CONTROL_URL }}
          TRON_GASLESS_REQUIRED_NETWORK: "tron"

      - name: Validate build
        id: validate_build
        uses: ./.github/actions/validate-build
        with:
          EXPECTED_TRON_GASLESS_ENABLED: "true"
          EXPECTED_TRON_GASLESS_RECEIVE_ENABLED: ${{ vars.TRON_GASLESS_RECEIVE_ENABLED || 'false' }}
          EXPECTED_TRON_GASLESS_BASE_URL: ${{ vars.TRON_GASLESS_BASE_URL }}
          EXPECTED_TRON_GASLESS_SERVICE_PROVIDER: ${{ vars.TRON_GASLESS_SERVICE_PROVIDER }}
          EXPECTED_TRON_GASLESS_CONTROL_URL: ${{ vars.TRON_GASLESS_CONTROL_URL }}
          EXPECTED_TRON_GASLESS_NETWORK: "tron"

      - name: Deploy SDK Integration Preview (Expires in 7 days)
        id: firebase_deploy
        uses: ./.github/actions/firebase-hosting-deploy
        with:
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_KOMODO_WALLET_OFFICIAL }}"
          channelId: "${{ steps.get_preview_channel_id.outputs.preview_channel_id }}"
          target: walletrc
          expires: 7d
          projectId: komodo-wallet-official

      - name: Display deployment information
        id: display_info
        shell: bash
        env:
          API_BRANCH: ${{ inputs.api_branch }}
          API_COMMIT: ${{ inputs.api_commit }}
          SDK_BRANCH: ${{ inputs.sdk_branch }}
          SDK_SHA: ${{ steps.update_sdk_branch.outputs.sdk_sha }}
        run: |
          echo "🚀 SDK Integration Preview deployed successfully!"
          printf '📦 SDK Branch: %s\n' "$SDK_BRANCH"
          printf '🔒 SDK Commit: %s\n' "$SDK_SHA"
          printf '🔧 API Branch: %s\n' "$API_BRANCH"
          printf '🔒 KDF Commit: %s\n' "$API_COMMIT"
          echo "🏷 Channel ID: ${{ steps.get_preview_channel_id.outputs.preview_channel_id }}"
          echo "🌐 Preview URL: ${{ steps.firebase_deploy.outputs.details_url }}"
          echo "⏰ Preview expires in 7 days"
          echo ""
          echo "You can access your preview at:"
          echo "${{ steps.firebase_deploy.outputs.details_url }}"
