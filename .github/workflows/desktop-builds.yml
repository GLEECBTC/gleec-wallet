name: Desktop Builds
run-name: Building desktop apps 🖥️

on:
  pull_request:
    branches: [dev, main, feat/solana-integration, fix/*, add/*, release/*, hotfix/*, feature/*]
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

env:
  TRON_GASLESS_MAINNET_BASE_URL: "https://quicknode.gleec.com/gasfree/tron"
  TRON_GASLESS_MAINNET_SERVICE_PROVIDER: "TLntW9Z59LYY5KEi9cmwk3PKjQga828ird"

jobs:
  build_desktop:
    name: Build Desktop (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            runner: macos-latest
            build_command: flutter build macos --no-pub --release
            artifact_path: build/macos/Build/Products/Release/*.app
            artifact_name: komodo-wallet-macos
          - platform: windows
            # Pinned to windows-2022 (VS 2022 / CMake 3.x / MSVC 14.4x). The
            # windows-latest image moved to VS 2026 (CMake 4.x, MSVC 14.51),
            # which breaks the build: the bundled Firebase C++ SDK requires
            # cmake_minimum_required < 3.5, and <experimental/coroutine> became
            # a hard error. Revert to windows-latest once the firebase_* and
            # local_auth_windows / flutter_inappwebview_windows plugins are
            # upgraded to versions compatible with the VS 2026 toolchain.
            runner: windows-2022
            build_command: flutter build windows --no-pub --release
            artifact_path: build/windows/x64/runner/Release/*
            artifact_name: komodo-wallet-windows
          - platform: linux
            # Build against the supported Ubuntu 22.04 / glibc 2.35 baseline.
            # Newer images link secure storage against GLIBC_2.38 and produce
            # an app that cannot even open on that baseline.
            runner: ubuntu-22.04
            build_command: flutter build linux --no-pub --release
            artifact_path: build/linux/x64/release/bundle/*
            artifact_name: komodo-wallet-linux

    steps:
      - name: Checkout code
        id: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      - name: Select public LI.FI profile
        id: lifi_profile
        uses: ./.github/actions/lifi-profile
        with:
          requested: production

      - name: Install Flutter and dependencies
        id: install_flutter
        uses: ./.github/actions/flutter-deps

      # macOS setup
      - name: Setup macOS environment
        id: setup_macos
        if: ${{ matrix.platform == 'macos' }}
        uses: ./.github/actions/releases/setup-macos
        with:
          p12-file-base64: ${{ secrets.MACOS_P12_BASE64 }}
          p12-password: ${{ secrets.MACOS_P12_PASSWORD }}
          bundle-id: "com.GleecDEX.wallet"
          profile-type: "MAC_APP_DEVELOPMENT"
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_PRIVATE_KEY }}

      # Linux setup
      - name: Setup Linux environment
        id: setup_linux
        if: ${{ matrix.platform == 'linux' }}
        uses: ./.github/actions/releases/setup-linux
        with:
          gpg-key: ${{ secrets.LINUX_GPG_KEY }}
          gpg-key-id: ${{ secrets.LINUX_GPG_KEY_ID }}

      # Windows setup
      - name: Setup Windows environment
        id: setup_windows
        if: ${{ matrix.platform == 'windows' }}
        uses: ./.github/actions/releases/setup-windows
        with:
          pfx-base64: ${{ secrets.WINDOWS_PFX_BASE64 }}
          pfx-password: ${{ secrets.WINDOWS_PFX_PASSWORD }}

      - name: Fetch packages, generate assets, and build for ${{ matrix.platform }}
        id: build
        env:
          GITHUB_API_PUBLIC_READONLY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Flutter only forwards Xcode overrides with the FLUTTER_XCODE_ prefix.
          # Build macOS unsigned unless signing material exists: setup-macos
          # imports it only in KomodoPlatform/komodo-wallet, so release and
          # manual runs here would otherwise fail at signing.
          FLUTTER_XCODE_CODE_SIGNING_ALLOWED: ${{ matrix.platform == 'macos' && (github.event_name == 'pull_request' || github.repository != 'KomodoPlatform/komodo-wallet') && 'NO' || '' }}
          FLUTTER_XCODE_CODE_SIGNING_REQUIRED: ${{ matrix.platform == 'macos' && (github.event_name == 'pull_request' || github.repository != 'KomodoPlatform/komodo-wallet') && 'NO' || '' }}
          FLUTTER_XCODE_CODE_SIGN_IDENTITY: ${{ matrix.platform == 'macos' && (github.event_name == 'pull_request' || github.repository != 'KomodoPlatform/komodo-wallet') && '' || '' }}
          FLUTTER_XCODE_CODE_SIGN_STYLE: ${{ matrix.platform == 'macos' && (github.event_name == 'pull_request' || github.repository != 'KomodoPlatform/komodo-wallet') && 'Manual' || '' }}
          FLUTTER_XCODE_DEVELOPMENT_TEAM: ${{ matrix.platform == 'macos' && (github.event_name == 'pull_request' || github.repository != 'KomodoPlatform/komodo-wallet') && '' || '' }}
          FLUTTER_XCODE_PROVISIONING_PROFILE_SPECIFIER: ${{ matrix.platform == 'macos' && (github.event_name == 'pull_request' || github.repository != 'KomodoPlatform/komodo-wallet') && '' || '' }}
        uses: ./.github/actions/generate-assets
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRELLO_API_KEY: ${{ secrets.TRELLO_API_KEY }}
          TRELLO_TOKEN: ${{ secrets.TRELLO_TOKEN }}
          TRELLO_BOARD_ID: ${{ secrets.TRELLO_BOARD_ID }}
          TRELLO_LIST_ID: ${{ secrets.TRELLO_LIST_ID }}
          FEEDBACK_API_KEY: ${{ secrets.FEEDBACK_API_KEY }}
          FEEDBACK_PRODUCTION_URL: ${{ secrets.FEEDBACK_PRODUCTION_URL }}
          MATOMO_URL: ${{ secrets.MATOMO_URL }}
          MATOMO_SITE_ID: ${{ secrets.MATOMO_SITE_ID }}
          BUILD_COMMAND: ${{ matrix.build_command }}
          LIFI_BUILD_ENVIRONMENT: ${{ steps.lifi_profile.outputs.environment }}
          TRON_GASLESS_ENABLED: "true"
          TRON_GASLESS_RECEIVE_ENABLED: "true"
          TRON_GASLESS_BASE_URL: ${{ env.TRON_GASLESS_MAINNET_BASE_URL }}
          TRON_GASLESS_SERVICE_PROVIDER: ${{ env.TRON_GASLESS_MAINNET_SERVICE_PROVIDER }}
          TRON_GASLESS_REQUIRED_NETWORK: "tron"

      - name: Verify Linux runtime dependencies
        if: ${{ matrix.platform == 'linux' }}
        shell: bash
        run: python3 tool/verify_linux_runtime.py build/linux/x64/release/bundle

      - name: Compute short commit SHA
        id: vars
        shell: bash
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        id: upload_artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          path: ${{ matrix.artifact_path }}
          name: ${{ matrix.artifact_name }}-${{ steps.vars.outputs.short_sha }}-${{ steps.lifi_profile.outputs.environment }}.zip
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

      - name: Attach public build provenance
        uses: ./.github/actions/build-provenance
        with:
          environment: ${{ steps.lifi_profile.outputs.environment }}
          artifact_path: ${{ matrix.artifact_path }}
          artifact_name: ${{ matrix.artifact_name }}-${{ steps.vars.outputs.short_sha }}-${{ steps.lifi_profile.outputs.environment }}.zip
