# Runs unit tests on PRs to ensure the app is working as expected
name: Run unit test on PR
run-name: ${{ github.actor }} is running unit tests on PR 🚀

on:
  pull_request:
    types: [opened, synchronize, reopened]

# Must match the values the build workflows compile with (see
# firebase-hosting-merge.yml and desktop-builds.yml). Non-secret: the same
# values are hardcoded there.
#
# Without these, `tronGaslessServiceProvider` falls back to its empty default
# (lib/shared/constants.dart), every GasFree provider-identity check fails
# closed, and ~36 gas-free tests never reach the state they await. They then
# hang rather than fail, because an unbounded `bloc.stream.firstWhere` has no
# deadline - which wedged the whole runner and made this job time out.
env:
  TRON_GASLESS_MAINNET_BASE_URL: "https://quicknode.gleec.com/gasfree/tron"
  TRON_GASLESS_MAINNET_SERVICE_PROVIDER: "TLntW9Z59LYY5KEi9cmwk3PKjQga828ird"

jobs:
  unit_tests:
    runs-on: ubuntu-latest
    # One complete test run collects coverage with the same pinned defines.
    # Reporting reuses that result and uses bounded, signed package mirrors.
    timeout-minutes: 50

    steps:
      - name: Setup GH Actions
        id: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      - name: Install Flutter and dependencies
        id: install_flutter
        uses: ./.github/actions/flutter-deps

      - name: Install browser security test runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Fetch packages and generate assets
        id: generate_assets
        uses: ./.github/actions/generate-assets
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate build
        id: validate_build
        uses: ./.github/actions/validate-build

      - name: Render public authentication states
        id: auth_ux
        timeout-minutes: 5
        env:
          AUTH_UX_CAPTURE_DIR: build/auth-ux
        run: |
          rm -rf build/auth-ux
          flutter test test_units/views/common/wallet_access/auth_setup_flow_test.dart \
            --dart-define=TRON_GASLESS_ENABLED=true \
            --dart-define=TRON_GASLESS_RECEIVE_ENABLED=true \
            --dart-define=TRON_GASLESS_BASE_URL="$TRON_GASLESS_MAINNET_BASE_URL" \
            --dart-define=TRON_GASLESS_SERVICE_PROVIDER="$TRON_GASLESS_MAINNET_SERVICE_PROVIDER"

      - name: Test unit_test (unix)
        id: unit_tests
        continue-on-error: false
        timeout-minutes: 20
        env:
          GITHUB_API_PUBLIC_READONLY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRON_GASLESS_BASE_URL: ${{ env.TRON_GASLESS_MAINNET_BASE_URL }}
          TRON_GASLESS_SERVICE_PROVIDER: ${{ env.TRON_GASLESS_MAINNET_SERVICE_PROVIDER }}
        run: |
          rm -f coverage/lcov.info
          flutter test --coverage test_units/main.dart \
            --dart-define=TRON_GASLESS_ENABLED=true \
            --dart-define=TRON_GASLESS_RECEIVE_ENABLED=true \
            --dart-define=TRON_GASLESS_BASE_URL="$TRON_GASLESS_BASE_URL" \
            --dart-define=TRON_GASLESS_SERVICE_PROVIDER="$TRON_GASLESS_SERVICE_PROVIDER"

      - name: Generate unit test coverage report
        id: unit_test_coverage
        timeout-minutes: 10
        uses: ./.github/actions/code-coverage

      - name: Retain public authentication state renders
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: onboarding-ui-states
          path: build/auth-ux/*.png
          if-no-files-found: error
          retention-days: 14
