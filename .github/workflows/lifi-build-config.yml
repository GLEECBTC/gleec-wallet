name: Validate LI.FI build configuration

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lifi_profile_validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate the production profile and regression checks
        run: |
          python3 tool/lifi_build_config.py production
          python3 -m unittest discover -s tool -p 'test_*lifi*.py' -v
