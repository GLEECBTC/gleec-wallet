name: Build Android Docker image

on:
  pull_request:
    branches:
      [
        dev,
        main,
        release/*,
        hotfix/*,
        bugfix/*,
        feature/*,
        chore/*,
        build/*,
        ci/*,
      ]
    paths:
      - ".docker/**"
      - "docs/LIFI_*BUILD_DEFINES.json"
      - "tool/lifi_build_config.py"
      - "android/**"
      - "pubspec.yaml"
      - "pubspec.lock"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android-docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Select public LI.FI profile
        id: lifi_profile
        uses: ./.github/actions/lifi-profile
        with:
          requested: production

      - name: Set up QEMU
        id: setup_qemu
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        id: setup_buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Temporary workaround until firebase configs are added to CI
      - name: Comment out Google Play Services import
        id: comment_google_play
        shell: bash
        run: |
          sed -i 's/id .com\.google\.gms\.google-services./\/\/ id .com\.google\.gms\.google-services./' android/app/build.gradle
          echo "Google Play Services import commented out"

      - name: Build Android image
        id: build_android
        env:
          GITHUB_API_PUBLIC_READONLY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LIFI_BUILD_ENVIRONMENT: ${{ steps.lifi_profile.outputs.environment }}
          # Optional feedback provider secrets to embed dart-defines
          TRELLO_API_KEY: ${{ secrets.TRELLO_API_KEY }}
          TRELLO_TOKEN: ${{ secrets.TRELLO_TOKEN }}
          TRELLO_BOARD_ID: ${{ secrets.TRELLO_BOARD_ID }}
          TRELLO_LIST_ID: ${{ secrets.TRELLO_LIST_ID }}
          FEEDBACK_API_KEY: ${{ secrets.FEEDBACK_API_KEY }}
          FEEDBACK_PRODUCTION_URL: ${{ secrets.FEEDBACK_PRODUCTION_URL }}
          MATOMO_URL: ${{ secrets.MATOMO_URL }}
          MATOMO_SITE_ID: ${{ secrets.MATOMO_SITE_ID }}
        run: |
          chmod +x .docker/build.sh
          sh .docker/build.sh apk release

      - name: Compute short commit SHA
        id: vars
        shell: bash
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Upload Android APK artifact
        id: upload_artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: komodo-wallet-android-docker-${{ steps.vars.outputs.short_sha }}-${{ steps.lifi_profile.outputs.environment }}.apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

      - name: Attach public build provenance
        uses: ./.github/actions/build-provenance
        with:
          environment: ${{ steps.lifi_profile.outputs.environment }}
          artifact_path: build/app/outputs/flutter-apk/app-release.apk
          artifact_name: komodo-wallet-android-docker-${{ steps.vars.outputs.short_sha }}-${{ steps.lifi_profile.outputs.environment }}.apk
