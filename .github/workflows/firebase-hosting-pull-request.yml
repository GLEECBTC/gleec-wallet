# Deploys a preview build to Firebase Hosting when a pull request is opened, synchronized, or reopened
name: Deploy to Firebase Hosting on PR
run-name: ${{ github.actor }} is deploying a preview build to Firebase Hosting 🚀

on:
  pull_request:
    branches:
      - dev
      - main
      - release/*
  workflow_dispatch:
    inputs:
      rc_legal_availability_bypass:
        description: "One-off #3557 test preview: bypass unpublished legal documents"
        type: boolean
        default: false
        required: false

permissions:
  contents: read
  issues: write
  pull-requests: write

# These are public, security-sensitive mainnet identities rather than secrets or
# rollout controls. Keep them version-controlled so a missing or out-of-band
# repository variable cannot silently change the provider used by a preview.
env:
  TRON_GASLESS_MAINNET_BASE_URL: "https://quicknode.gleec.com/gasfree/tron"
  TRON_GASLESS_MAINNET_SERVICE_PROVIDER: "TLntW9Z59LYY5KEi9cmwk3PKjQga828ird"

# Cancel an in-flight preview build when a new commit is pushed to the same PR,
# so two runs never race to create/update the same Firebase preview channel.
concurrency:
  group: firebase-preview-${{ (github.event_name == 'workflow_dispatch' && inputs.rc_legal_availability_bypass && github.ref == 'refs/heads/feat/kdf-667045c' && 3557) || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest

    steps:
      - name: Shortify commit sha
        id: shortify_commit
        shell: bash
        run: echo "sha_short=$(echo ${GITHUB_SHA::7})" >> $GITHUB_OUTPUT

      - name: Get branch
        id: get_branch
        shell: bash
        run: echo "ref_short=$(echo ${GITHUB_REF##*/})" >> $GITHUB_OUTPUT

      - name: Get Preview Channel ID
        id: get_preview_channel_id
        shell: bash
        env:
          RC_LEGAL_BYPASS: ${{ github.event_name == 'workflow_dispatch' && inputs.rc_legal_availability_bypass }}
        run: |
          set -euo pipefail
          channel_id="${GITHUB_REF#*/}"
          if [ "$RC_LEGAL_BYPASS" = "true" ]; then
            # Only this manual RC test run may replace its existing preview.
            # Ordinary PR runs and all production builds retain the gate.
            if [ "$GITHUB_REF" != "refs/heads/feat/kdf-667045c" ]; then
              echo "Legal availability bypass is restricted to RC #3557."
              exit 1
            fi
            channel_id="pull/3557/merge"
            echo "RC #3557 only: legal-document availability bypass enabled; consent and trading policy remain enforced." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "preview_channel_id=$channel_id" >> "$GITHUB_OUTPUT"
          echo "legal_bypass=$RC_LEGAL_BYPASS" >> "$GITHUB_OUTPUT"

      - name: Setup GH Actions
        id: checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Flutter and dependencies
        id: install_flutter
        uses: ./.github/actions/flutter-deps

      - name: Fetch packages and generate assets
        id: generate_assets
        uses: ./.github/actions/generate-assets
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_COMMAND: >-
            flutter build web --no-pub --release
            --dart-define=BYPASS_LEGAL_DOCUMENT_GATE=${{ steps.get_preview_channel_id.outputs.legal_bypass }}
          # Optionally provide feedback service configuration if available
          FEEDBACK_API_KEY: ${{ secrets.FEEDBACK_API_KEY }}
          FEEDBACK_PRODUCTION_URL: ${{ secrets.FEEDBACK_PRODUCTION_URL }}
          TRELLO_API_KEY: ${{ secrets.TRELLO_API_KEY }}
          TRELLO_TOKEN: ${{ secrets.TRELLO_TOKEN }}
          TRELLO_BOARD_ID: ${{ secrets.TRELLO_BOARD_ID }}
          TRELLO_LIST_ID: ${{ secrets.TRELLO_LIST_ID }}
          # Matomo analytics configuration (optional). If not provided, analytics will be disabled in CI.
          MATOMO_URL: ${{ secrets.MATOMO_URL }}
          MATOMO_SITE_ID: ${{ secrets.MATOMO_SITE_ID }}
          ANALYTICS_DISABLED: true
          # Feature previews are production-equivalent GasFree canaries.
          TRON_GASLESS_ENABLED: "true"
          TRON_GASLESS_RECEIVE_ENABLED: "true"
          TRON_GASLESS_BASE_URL: ${{ env.TRON_GASLESS_MAINNET_BASE_URL }}
          TRON_GASLESS_SERVICE_PROVIDER: ${{ env.TRON_GASLESS_MAINNET_SERVICE_PROVIDER }}
          TRON_GASLESS_REQUIRED_NETWORK: "tron"

      - name: Validate build
        id: validate_build
        uses: ./.github/actions/validate-build
        with:
          EXPECTED_TRON_GASLESS_ENABLED: "true"
          EXPECTED_TRON_GASLESS_RECEIVE_ENABLED: "true"
          EXPECTED_TRON_GASLESS_BASE_URL: ${{ env.TRON_GASLESS_MAINNET_BASE_URL }}
          EXPECTED_TRON_GASLESS_SERVICE_PROVIDER: ${{ env.TRON_GASLESS_MAINNET_SERVICE_PROVIDER }}
          EXPECTED_TRON_GASLESS_NETWORK: "tron"

      - name: Deploy Gleec Wallet web feature preview (Expires in 7 days)
        id: deploy_preview
        uses: ./.github/actions/firebase-hosting-deploy
        with:
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_KOMODO_WALLET_OFFICIAL }}"
          channelId: "${{ steps.get_preview_channel_id.outputs.preview_channel_id }}"
          target: web
          expires: 7d
          projectId: komodo-wallet-official

      - name: Comment Firebase preview URL
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREVIEW_URL: ${{ steps.deploy_preview.outputs.details_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CHANNEL_ID: ${{ steps.get_preview_channel_id.outputs.preview_channel_id }}
        run: |
          set -euo pipefail

          if [ -z "$PREVIEW_URL" ]; then
            echo "Firebase deploy did not return a preview URL."
            exit 1
          fi

          marker="<!-- firebase-hosting-preview-url -->"
          body="$(cat <<EOF
          $marker
          ### Firebase Hosting Preview

          Preview URL: $PREVIEW_URL

          Channel: \`$CHANNEL_ID\`
          Expires: 7d
          Run: $RUN_URL
          EOF
          )"

          comment_id="$(
            gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
              --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- firebase-hosting-preview-url -->"))) | .id' \
              | tail -n 1
          )"

          if [ -n "$comment_id" ]; then
            jq -n --arg body "$body" '{body: $body}' \
              | gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" --input -
          else
            jq -n --arg body "$body" '{body: $body}' \
              | gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --input -
          fi

      - name: Deploy Gleec Wallet Web dev preview (`dev` branch)
        id: deploy_dev
        if: github.ref == 'refs/heads/dev' && github.event_name != 'workflow_dispatch'
        uses: ./.github/actions/firebase-hosting-deploy
        with:
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_KOMODO_WALLET_OFFICIAL }}"
          channelId: dev-preview
          target: web
          projectId: komodo-wallet-official
