name: "Code Coverage"
description: "Renders and uploads coverage from the successful test step"
runs:
  using: "composite"
  steps:
    - name: Render tested coverage
      id: run_coverage
      shell: bash
      run: bash .github/scripts/render_coverage.sh

    - name: Upload Code Coverage Report
      id: upload_lcov
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        if-no-files-found: error
        name: ${{ runner.os }}-lcov.info
        path: ./coverage/lcov.info

    - name: Upload Code Coverage HTML Report
      id: upload_html
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        if-no-files-found: error
        name: ${{ runner.os }}-coverage-html
        path: ./coverage-html.zip
