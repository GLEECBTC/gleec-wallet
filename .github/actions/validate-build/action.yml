name: "Validate build"
description: "Checks that all the necessary files are present in the build directory"
inputs:
  EXPECTED_TRON_GASLESS_ENABLED:
    description: "Whether the compiled Flutter web build must enable GasFree send"
    required: false
    default: "false"
  EXPECTED_TRON_GASLESS_RECEIVE_ENABLED:
    description: "Whether the compiled Flutter web build must enable GasFree receive"
    required: false
    default: "false"
  EXPECTED_TRON_GASLESS_BASE_URL:
    description: "TRON GasFree provider base URL expected in the compiled Flutter web build"
    required: false
    default: ""
  EXPECTED_TRON_GASLESS_SERVICE_PROVIDER:
    description: "TRON GasFree service provider address expected in the compiled Flutter web build"
    required: false
    default: ""
  EXPECTED_TRON_GASLESS_CONTROL_URL:
    description: "GasFree receive control endpoint expected in the compiled Flutter web build"
    required: false
    default: ""
  EXPECTED_TRON_GASLESS_NETWORK:
    description: "Optional deployment-policy restriction for the GasFree network path (tron/nile)"
    required: false
    default: ""
runs:
  using: "composite"
  steps:
    - name: Validate build
      id: validate
      continue-on-error: false
      shell: bash
      env:
        TRON_GASLESS_ENABLED: ${{ inputs.EXPECTED_TRON_GASLESS_ENABLED }}
        TRON_GASLESS_RECEIVE_ENABLED: ${{ inputs.EXPECTED_TRON_GASLESS_RECEIVE_ENABLED }}
        TRON_GASLESS_BASE_URL: ${{ inputs.EXPECTED_TRON_GASLESS_BASE_URL }}
        TRON_GASLESS_SERVICE_PROVIDER: ${{ inputs.EXPECTED_TRON_GASLESS_SERVICE_PROVIDER }}
        TRON_GASLESS_CONTROL_URL: ${{ inputs.EXPECTED_TRON_GASLESS_CONTROL_URL }}
        TRON_GASLESS_REQUIRED_NETWORK: ${{ inputs.EXPECTED_TRON_GASLESS_NETWORK }}
        TRON_GASLESS_CONFIG_VALIDATOR: ${{ github.action_path }}/../../scripts/validate_tron_gasless_config.sh
      run: |
        SDK_KDF_ASSETS_DIR=build/web/assets/packages/komodo_defi_framework

        # Check that the web build folder contains a wasm file in the format build/web/kdf/kdf/bin/*.wasm
        shopt -s nullglob
        wasm_files=(build/web/kdf/kdf/bin/*.wasm)
        if [ ${#wasm_files[@]} -eq 0 ]; then
          echo "Error: Web build failed. No wasm file found in build/web/kdf/kdf/bin"
          # List files for debugging
          echo "Listing files in build/web/kdf recursively"
          ls -R build/web/kdf 2>/dev/null || echo "build/web/kdf directory does not exist"

          echo "Listing files in web/kdf recursively"
          ls -R web/kdf 2>/dev/null || echo "web/kdf directory does not exist"

          exit 1
        fi
        echo "Found wasm files: ${wasm_files[@]}"

        # Check that the index.html is present and that it is equal to the source index.html
        if ! cmp -s web/index.html build/web/index.html; then
          echo "Error: Web build failed. index.html is not equal to the source index.html"
          exit 1
        fi

        APP_JS=build/web/main.dart.js
        if [ ! -f "$APP_JS" ]; then
          echo "Error: Web build failed. main.dart.js file not found."
          exit 1
        fi

        bash "$TRON_GASLESS_CONFIG_VALIDATOR"

        case "$TRON_GASLESS_ENABLED:$TRON_GASLESS_RECEIVE_ENABLED" in
          false:false)
            EXPECTED_GASLESS_BUILD_POLICY_MARKER='gleec-gasfree-build-policy-v1:send=disabled;receive=disabled'
            ;;
          true:false)
            EXPECTED_GASLESS_BUILD_POLICY_MARKER='gleec-gasfree-build-policy-v1:send=enabled;receive=disabled'
            ;;
          false:true)
            EXPECTED_GASLESS_BUILD_POLICY_MARKER='gleec-gasfree-build-policy-v1:send=disabled;receive=enabled'
            ;;
          true:true)
            EXPECTED_GASLESS_BUILD_POLICY_MARKER='gleec-gasfree-build-policy-v1:send=enabled;receive=enabled'
            ;;
        esac

        if ! grep -Fq "$EXPECTED_GASLESS_BUILD_POLICY_MARKER" "$APP_JS"; then
          echo "Error: Compiled GasFree switches do not match the expected build policy marker."
          exit 1
        fi

        gasless_build_policy_markers=(
          'gleec-gasfree-build-policy-v1:send=disabled;receive=disabled'
          'gleec-gasfree-build-policy-v1:send=enabled;receive=disabled'
          'gleec-gasfree-build-policy-v1:send=disabled;receive=enabled'
          'gleec-gasfree-build-policy-v1:send=enabled;receive=enabled'
        )
        for marker in "${gasless_build_policy_markers[@]}"; do
          if [ "$marker" != "$EXPECTED_GASLESS_BUILD_POLICY_MARKER" ] &&
             grep -Fq "$marker" "$APP_JS"; then
            echo "Error: Web build contains a conflicting GasFree build policy marker."
            exit 1
          fi
        done

        if [ -n "$TRON_GASLESS_BASE_URL" ] && ! grep -Fq "$TRON_GASLESS_BASE_URL" "$APP_JS"; then
          echo "Error: Web build is not configured with the expected TRON GasFree proxy."
          exit 1
        fi

        if [ -n "$TRON_GASLESS_SERVICE_PROVIDER" ] && ! grep -Fq "$TRON_GASLESS_SERVICE_PROVIDER" "$APP_JS"; then
          echo "Error: Web build is not configured with the expected TRON GasFree service provider."
          exit 1
        fi

        if [ -n "$TRON_GASLESS_CONTROL_URL" ] && ! grep -Fq "$TRON_GASLESS_CONTROL_URL" "$APP_JS"; then
          echo "Error: Web build is missing the expected TRON GasFree receive control endpoint."
          exit 1
        fi

        disallowed_gasless_values=(
          "http://localhost:6150/gasfree/tron"
          "http://localhost:6160/gasfree/tron"
          "https://open.gasfree.io"
        )
        for value in "${disallowed_gasless_values[@]}"; do
          if grep -Fq "$value" "$APP_JS"; then
            echo "Error: Web build contains disallowed TRON GasFree endpoint: $value"
            exit 1
          fi
        done

        if [ -n "$TRON_GASLESS_BASE_URL" ]; then
          echo "TRON GasFree build configuration and switches verified."
        else
          echo "TRON GasFree endpoint is not embedded in this disabled-by-default build."
        fi

        # Check that the generated KMD icon exists and was registered in the
        # binary asset manifest. Redirect grep output instead of using `-q` so
        # `pipefail` cannot turn a successful early match into a SIGPIPE error.
        KMD_ICON="$SDK_KDF_ASSETS_DIR/assets/coin_icons/png/kmd.png"
        ASSET_MANIFEST=build/web/assets/AssetManifest.bin

        if [ ! -s "$KMD_ICON" ]; then
          echo "Error: Generated KMD coin icon not found at $KMD_ICON"
          echo "Available KMD icon paths:"
          find build/web/assets -iname 'kmd.png' -print || true
          exit 1
        fi

        if [ ! -f "$ASSET_MANIFEST" ]; then
          echo "Error: AssetManifest.bin file not found."
          exit 1
        fi

        if ! strings "$ASSET_MANIFEST" | grep -Fi "assets/coin_icons/png/kmd.png" > /dev/null; then
          echo "Error: KMD coin icon not found in AssetManifest.bin"
          echo "Coin-icon entries found in the manifest:"
          strings "$ASSET_MANIFEST" | grep -Fi "assets/coin_icons/png/" | head -n 20 || true
          exit 1
        fi

        # Check that $SDK_KDF_ASSETS_DIR/app_build/build_config.json is present, and is valid json
        if [ ! -f $SDK_KDF_ASSETS_DIR/app_build/build_config.json ]; then
          echo "Error: build_config.json file not found."
          exit 1
        fi
        if ! jq . $SDK_KDF_ASSETS_DIR/app_build/build_config.json > /dev/null; then
          echo "Error: build_config.json is not valid json"
          exit 1
        fi

        # Check that $SDK_KDF_ASSETS_DIR/assets/config/coins.json is present, and is valid json
        if [ ! -f $SDK_KDF_ASSETS_DIR/assets/config/coins.json ]; then
          echo "Error: coins.json file not found."
          exit 1
        fi
        if ! jq . $SDK_KDF_ASSETS_DIR/assets/config/coins.json > /dev/null; then
          echo "Error: coins.json is not valid json"
          exit 1
        fi

        # Check that $SDK_KDF_ASSETS_DIR/assets/config/coins_config.json is present, and is valid json
        if [ ! -f $SDK_KDF_ASSETS_DIR/assets/config/coins_config.json ]; then
          echo "Error: coins_config.json file not found."
          exit 1
        fi
        if ! jq . $SDK_KDF_ASSETS_DIR/assets/config/coins_config.json > /dev/null; then
          echo "Error: coins_config.json is not valid json"
          exit 1
        fi
