name: Select LI.FI build profile
description: Select a validated public profile from the triggering event
inputs:
  requested:
    description: Manual workflow choice; ignored for automatic events
    default: staging
outputs:
  environment:
    description: Validated staging or production profile
    value: ${{ steps.select.outputs.environment }}
runs:
  using: composite
  steps:
    - id: select
      shell: bash
      env:
        REQUESTED_PROFILE: ${{ inputs.requested }}
      run: |
        profile=$(python3 tool/lifi_build_config.py "${REQUESTED_PROFILE:-staging}" --event "$GITHUB_EVENT_NAME")
        echo "environment=$profile" >> "$GITHUB_OUTPUT"
