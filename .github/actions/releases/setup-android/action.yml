---
name: "Setup Android Build Environment"
description: "Configures Java, Android SDK and signing for Android builds"

inputs:
  java-version:
    description: "Java version to use"
    required: false
    default: "21"
  keystore-base64:
    description: "Base64 encoded Android keystore file"
    required: false
  key-alias:
    description: "Android keystore key alias"
    required: false
  store-password:
    description: "Android keystore password"
    required: false
  key-password:
    description: "Android keystore key password"
    required: false

runs:
  using: "composite"
  steps:
    - name: Set up JDK
      id: setup_jdk
      uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
      with:
        java-version: ${{ inputs.java-version }}
        distribution: "temurin"
        cache: "gradle"

    - name: Setup Android SDK
      id: setup_android_sdk
      uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      with:
        packages: platform-tools

    # "Fixes firebase build error when no valid google-services.json is present"
    - name: Comment out Google Play Services import
      id: comment_google_play
      shell: bash
      run: |
        sed -i 's/id .com\.google\.gms\.google-services./\/\/ id .com\.google\.gms\.google-services./' android/app/build.gradle
        echo "Google Play Services import commented out"

    - name: Setup Android keystore
      id: setup_keystore
      if: inputs.keystore-base64 != '' && github.event_name != 'pull_request'
      shell: bash
      env:
        GLEEC_SIGNING_KEYSTORE: ${{ inputs.keystore-base64 }}
        GLEEC_SIGNING_ALIAS: ${{ inputs.key-alias }}
        GLEEC_SIGNING_STORE_PASSWORD: ${{ inputs.store-password }}
        GLEEC_SIGNING_KEY_PASSWORD: ${{ inputs.key-password }}
      run: |
        umask 077
        python3 - <<'PY'
        import base64
        import os
        from pathlib import Path

        def property_value(value):
            # Java Properties.load uses Latin-1 with Java Unicode escapes.
            units = value.encode('utf-16-be')
            return ''.join('\\u' + units[i:i+2].hex() for i in range(0, len(units), 2))

        try:
            values = {
                'storeFile': 'upload-keystore.jks',
                'keyAlias': os.environ['GLEEC_SIGNING_ALIAS'],
                'storePassword': os.environ['GLEEC_SIGNING_STORE_PASSWORD'],
                'keyPassword': os.environ['GLEEC_SIGNING_KEY_PASSWORD'],
            }
            if not all(values.values()):
                raise ValueError()
            encoded = ''.join(os.environ['GLEEC_SIGNING_KEYSTORE'].split())
            keystore = base64.b64decode(encoded, validate=True)
            if not keystore:
                raise ValueError()
            destination = Path('android/app/upload-keystore.jks')
            destination.write_bytes(keystore)
            destination.chmod(0o600)
            properties = Path('android/key.properties')
            properties.write_text(''.join(k + '=' + property_value(v) + '\n' for k, v in values.items()), encoding='ascii')
            properties.chmod(0o600)
        except Exception:
            raise SystemExit('Android release signing inputs could not be prepared.') from None
        PY
