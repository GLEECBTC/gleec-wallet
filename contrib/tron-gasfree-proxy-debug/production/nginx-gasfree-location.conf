# Production shape for the edge in front of komodo-defi-proxy.
#
# Assumptions:
# - The proxy listens on 127.0.0.1:6150.
# - If this NGINX is behind Cloudflare or another trusted L7 proxy, configure
#   ngx_http_realip_module outside this location so $remote_addr is already the
#   real client IP. Otherwise $remote_addr is the direct TCP peer.
# - Do not use $http_x_forwarded_for here. The proxy currently trusts a single
#   X-Forwarded-For value when deciding private-IP bypass.
# - Define and apply approved per-client/global limit_req zones in the enclosing
#   http/server configuration. This location is not production-ready without
#   those deployment-specific zones and 429 handling.
# - The application proxy must sanitize upstream errors before this edge. Never
#   expose raw GasFree provider bodies as a browser error response.

location /gasfree/ {
  if ($request_method = OPTIONS) {
    add_header Access-Control-Allow-Origin  "*" always;
    add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,X-Auth-Payload" always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
    add_header Access-Control-Max-Age       "86400" always;
    add_header Content-Type                 "text/plain; charset=utf-8" always;
    add_header Content-Length               "0" always;
    return 204;
  }

  # These describe the browser -> edge leg. GasFree's upstream WAF rejects some
  # browser Origin values, and the proxy branch strips them again as defense in depth.
  proxy_set_header Origin  "";
  proxy_set_header Referer "";

  # Keep this real and single-valued. Never clear it in production and never
  # forward client-supplied XFF verbatim.
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Real-IP       $remote_addr;
  proxy_set_header Host            $host;
  proxy_http_version 1.1;

  proxy_hide_header Access-Control-Allow-Origin;
  proxy_hide_header Access-Control-Allow-Headers;
  proxy_hide_header Access-Control-Allow-Methods;

  proxy_pass http://127.0.0.1:6150;

  add_header Access-Control-Allow-Origin  "*" always;
  add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,X-Auth-Payload" always;
  add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
  add_header Access-Control-Expose-Headers "Content-Length,Content-Range" always;
}
