# OpenResty (nginx + lua) edge in front of the (stock) komodo-defi-proxy.
# LOCAL TESTING ONLY — verbose, logs error response bodies, and bypasses the proxy gate.
#
#   1. CORS — strip browser `Origin`/`Referer` before forwarding (Cloudflare/GasFree stop
#      403-ing), hide the proxy's own CORS headers and add ours (browser-readable).
#   2. Gate bypass (LOCAL ONLY) — clear `X-Forwarded-For` so the proxy sees this
#      container's private IP and bypasses its libp2p validation. *** In production set
#      XFF to the real client and mesh the proxy's KDF node on netid 6133 instead. ***
#   3. Observability — access log with client + UPSTREAM status and timing, and (via lua)
#      the upstream RESPONSE BODY for any 4xx/5xx so you can see GasFree's actual error
#      ("Apikey not found", "Authorization hash not match", Cloudflare "error code: 1010",
#      etc.) without hand-curling.

worker_processes 1;
events {}

http {
  default_type application/octet-stream;

  # request -> outcome, including what GasFree (upstream) returned.
  log_format gasfree escape=none
      '$time_iso8601 $request_method "$request_uri" '
      'client=$status upstream=$upstream_status '
      'rt=${request_time}s urt=${upstream_response_time}s bytes=$body_bytes_sent';

  access_log /dev/stdout gasfree;
  error_log  /dev/stderr warn;

  server {
    listen 80;
    server_name _;

    location / {
      # --- CORS: make upstream happy + browser-readable response ---
      proxy_set_header Origin   "";
      proxy_set_header Referer  "";
      # --- LOCAL DEBUG: present internal traffic so the proxy bypasses its gate ---
      proxy_set_header X-Forwarded-For "";
      proxy_set_header Host $host;
      proxy_http_version 1.1;

      proxy_hide_header Access-Control-Allow-Origin;
      proxy_hide_header Access-Control-Allow-Headers;
      proxy_hide_header Access-Control-Allow-Methods;

      proxy_pass http://proxy:6150;

      add_header Access-Control-Allow-Origin  "*" always;
      add_header Access-Control-Allow-Headers "*" always;
      add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
      add_header Access-Control-Max-Age       "86400" always;

      # --- LOCAL DEBUG: capture the upstream response body and log it on error ---
      # Buffer the (small) response body, capped. We log it when EITHER the HTTP status
      # is 4xx/5xx (auth/CORS/infra errors: "Apikey not found", "hash not match",
      # Cloudflare "error code: 1010") OR the GasFree envelope code != 200 (business
      # errors, which GasFree returns as HTTP 200 + {"code":<n>,...}).
      body_filter_by_lua_block {
        local chunk = ngx.arg[1]
        if chunk and #chunk > 0 then
          local buf = (ngx.ctx.respbody or "") .. chunk
          if #buf > 4096 then buf = string.sub(buf, 1, 4096) .. "...<truncated>" end
          ngx.ctx.respbody = buf
        end
      }
      log_by_lua_block {
        local body = ngx.ctx.respbody or ""
        local code = body:match('"code"%s*:%s*(%d+)')           -- GasFree envelope code
        local http_err = ngx.status >= 400
        local env_err  = (code ~= nil and code ~= "200")
        if http_err or env_err then
          ngx.log(ngx.WARN, "[gasfree-error] ", ngx.var.request_method, " ",
                  ngx.var.request_uri,
                  " client=", ngx.status,
                  " upstream=", (ngx.var.upstream_status or "-"),
                  (code and (" code=" .. code) or ""),
                  " body=", (body ~= "" and body or "<empty>"))
        end
      }
    }
  }
}
